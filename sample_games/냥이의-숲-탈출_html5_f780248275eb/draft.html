  if(e.code==='KeyR') requestRestart();
});
document.addEventListener('keyup', e=>{ keys[e.code]=false; });

let touchLeft=false, touchRight=false, touchJump=false;
function addTouch(){
  const btnStyle = 'position:fixed;bottom:20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;z-index:100;';
  const makeBtn = (label, leftPx, action)=>{
    const b = document.createElement('div');
    b.style.cssText = btnStyle + 'left:'+leftPx+'px;';
    b.textContent = label;
    b.addEventListener('touchstart', e=>{ e.preventDefault(); action(true); }, {passive:false});
    b.addEventListener('touchend', e=>{ e.preventDefault(); action(false); }, {passive:false});
    document.body.appendChild(b);
  };
  makeBtn('←', 20, v=>{ touchLeft=v; });
  makeBtn('→', 100, v=>{ touchRight=v; });
  makeBtn('↑', W-90, v=>{ touchJump=v; });
}
if('ontouchstart' in window) addTouch();

function isLeft(){ return keys['ArrowLeft']||keys['KeyA']||touchLeft; }

function isJump(){ return keys['Space']||keys['ArrowUp']||keys['KeyW']||touchJump; }

// ── Particles ────────────────────────────────────────────────────────────────
const particles = [];
function spawnParticles(wx, wy, color, count, speed){
  for(let i=0;i<count;i++){
    const a = (Math.PI*2/count)*i;
    particles.push({wx, wy, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, life:1, maxLife:1, color, r:4});
  }
}
function spawnBrickParticles(wx, wy){
  for(let i=0;i<6;i++){
    particles.push({wx:wx+Math.random()*TILE, wy:wy+Math.random()*TILE,
      vx:(Math.random()-0.5)*200, vy:-Math.random()*300-100,
      life:1, maxLife:1, color:'#A0522D', r:6, isRect:true, w:8, h:8});
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.wx+=p.vx*dt; p.wy+=p.vy*dt;
    p.vy+=GRAVITY*0.3*dt;
    p.life-=dt*1.5;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const sx=p.wx-camera.x;
    if(sx<-20||sx>W+20) continue;
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    if(p.isRect){ ctx.fillRect(sx-p.w/2,p.wy-p.h/2,p.w,p.h); }
    else{ ctx.beginPath(); ctx.arc(sx,p.wy,p.r,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}

// ── AABB helpers ──────────────────────────────────────────────────────────────
function overlaps(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function resolveAABB(obj, rect, prevY){
  if(!overlaps(obj,rect)) return null;
  const overlapL = (obj.x+obj.w) - rect.x;
  const overlapR = (rect.x+rect.w) - obj.x;
  const overlapT = (obj.y+obj.h) - rect.y;
  const overlapB = (rect.y+rect.h) - obj.y;
  const minH = Math.min(overlapL,overlapR);
  const minV = Math.min(overlapT,overlapB);
  const fromTop = prevY + obj.h <= rect.y + 6;
  if(minV < minH){
    if(overlapT < overlapB){
      obj.y = rect.y - obj.h;
      if(obj.vy>0) obj.vy=0;
      obj.onGround=true;
      return 'top';
    } else {
      obj.y = rect.y + rect.h;
      if(obj.vy<0) obj.vy=0;
      return 'bottom';
    }
  } else {
    if(overlapL < overlapR){
      obj.x = rect.x - obj.w;
      obj.vx=0;
      return 'left';
    } else {
      obj.x = rect.x + rect.w;
      obj.vx=0;
      return 'right';
    }
  }
}

function updatePlayer(dt){
  if(respawnTimer>0){
    respawnTimer-=dt;
    if(respawnTimer<=0){
      player.x=lastSafeX; player.y=lastSafeY;
      player.vx=0; player.vy=0;
      player.invincible=2;
    }
    return;
  }

  // Big timer countdown
  if(player.big && player.bigTimer>0){
    player.bigTimer-=dt;
    if(player.bigTimer<=0){
      // Shrink back
      player.big=false;
      player.w=40; player.h=44;
    }
  }

  // Horizontal movement
  if(isRight()){ player.vx=Math.min(player.vx+PLAYER_ACCEL*dt, PLAYER_SPEED); player.facingRight=true; }
  else if(isLeft()){ player.vx=Math.max(player.vx-PLAYER_ACCEL*dt, -PLAYER_SPEED); player.facingRight=false; }
  else {
    const fric = PLAYER_FRICTION*dt;
    if(player.vx>0) player.vx=Math.max(0,player.vx-fric);
    else if(player.vx<0) player.vx=Math.min(0,player.vx+fric);
  }

  // Jump
  if(isJump()){
    if(player.onGround && !jumpHeld){
      player.vy=JUMP_POWER;
      jumpHeld=true; jumpHeldTime=0;
      player.scaleY=1.2; player.scaleYTimer=0.08;
      player.isJumping=true;
    }
    if(jumpHeld && jumpHeldTime<JUMP_HOLD_TIME){
      player.vy+=JUMP_HOLD_BONUS*dt;
      jumpHeldTime+=dt;
    }
  } else {
    jumpHeld=false;
  }

  // Walk animation
  if(player.onGround && (isLeft()||isRight())){
    player.walkTimer+=dt;
    if(player.walkTimer>0.12){ player.walkTimer=0; player.walkFrame=(player.walkFrame+1)%3; }
  } else if(player.onGround){
    player.walkFrame=0; player.walkTimer=0;
  }

  // ScaleY tween
  if(player.scaleYTimer>0){ player.scaleYTimer-=dt; }
  else { player.scaleY+=(1-player.scaleY)*0.3; }

  // Gravity
  player.vy+=GRAVITY*dt;
  player.vy=Math.min(player.vy,900);

  const prevY=player.y;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  player.onGround=false;

  // Clamp left
  if(player.x<0){ player.x=0; player.vx=0; }

  // Platform collisions
  for(const p of platforms){
    const res=resolveAABB(player,p,prevY);
    if(res==='top'){ player.isJumping=false; player.scaleY=0.75; player.scaleYTimer=0.07; }
  }
  for(const b of bricks){
    if(b.broken) continue;
    const res=resolveAABB(player,b,prevY);
    if(res==='bottom') hitBrick(b);
    if(res==='top'){ player.isJumping=false; }
  }

  // Fishbread collision
  for(let i=fishbreads.length-1;i>=0;i--){
    const fb=fishbreads[i];
    if(!fb.active) continue;
    const fbRect={x:fb.wx-fb.w/2, y:fb.wy-fb.h/2, w:fb.w, h:fb.h};
    if(overlaps(player,fbRect)){
      // Collect fishbread - grow player
      fb.active=false;
      fishbreads.splice(i,1);
      if(!player.big){
        player.big=true;
        player.bigTimer=15; // 15 seconds big
        // Grow: shift y up so feet stay on ground
        const oldH=player.h;
        player.w=64; player.h=70;
        player.y-=(player.h-oldH);
      } else {
        // Already big: reset timer and give score
        player.bigTimer=15;
      }
      score+=20;
      spawnParticles(fb.wx, fb.wy, '#FFD700', 8, 150);
      // Flash green
      flashTime=0.2; flashColor='green';
    }
  }

  // Boss trigger
  if(gameState==='PLAYING' && player.x>BOSS_TRIGGER_X){
    gameState='BOSS_FIGHT';
    bossIntro=true;
    setTimeout(()=>{ bossIntro=false; }, 1200);
  }

  // Fall death
  if(player.y>H+60) playerDie();

  // Safe position
  if(player.onGround && player.invincible<=0){
    lastSafeX=player.x; lastSafeY=player.y;
  }

  if(player.invincible>0) player.invincible-=dt;
}

function playerDie(){
  // Shrink back if big
  if(player.big){ player.big=false; player.w=40; player.h=44; }
  lives--;
  shake(6,0.4);
  if(lives<=0){ gameState='GAME_OVER'; return; }
  respawnTimer=0.6;
  player.vy=0; player.vx=0;
  player.y=H+200;
  flashTime=0.3; flashColor='red';
}

function playerHit(){
  if(player.invincible>0) return;
  // If big, shrink instead of losing life
  if(player.big){
    player.big=false;
    player.bigTimer=0;
    const oldH=player.h;
    player.w=40; player.h=44;
    player.y+=(oldH-player.h);
    player.invincible=1.5;
    shake(3,0.15);
    flashTime=0.2; flashColor='red';
    return;
  }
  lives--;
  player.invincible=1.5;
  player.vx = player.facingRight ? -200 : 200;
  player.vy = -300;
  shake(4,0.2);
  flashTime=0.25; flashColor='red';
  if(lives<=0){ gameState='GAME_OVER'; }
}

function hitBrick(b){
  if(b.broken) return;
  b.broken=true;
  spawnBrickParticles(b.x,b.y);
  const wx=b.x+b.w/2, wy=b.y;
  if(b.hasQ){
    // Spawn fishbread from ? block
    fishbreads.push({wx, wy:wy-20, w:36, h:28, vy:-200, active:true, bobPhase:Math.random()*Math.PI*2});
  } else {
    // Regular brick: spawn coin
    floatingCoins.push({wx, wy, vy:-300, life:1.2});
    score+=10;
  }
}

// ── Enemy update ──────────────────────────────────────────────────────────────
function updateEnemies(dt){
  for(const e of enemies){
    if(!e.alive) continue;

    // Blink timer
    e.blinkTimer-=dt;
    if(e.blinkTimer<=0) e.blinkTimer=2+Math.random()*2;

    // Walk animation
    e.walkTimer=(e.walkTimer||0)+dt;
    if(e.walkTimer>0.15){ e.walkTimer=0; e.walkFrame=(e.walkFrame+1)%3; }

    // Floating enemies (ghost, bat)
    if(e.type==='ghost'||e.type==='bat'){
      e.x+=e.vx*dt;
      if(e.floatY!==undefined){
        e.y=e.floatY+Math.sin(e.walkTimer*e.floatSpeed+e.blinkTimer)*e.floatAmp;
      }
      // Reverse at stage bounds
      if(e.x<0){ e.x=0; e.vx=Math.abs(e.vx); }
      if(e.x+e.w>STAGE_WIDTH){ e.x=STAGE_WIDTH-e.w; e.vx=-Math.abs(e.vx); }
    } else {
      // Ground enemies
      e.vy+=GRAVITY*dt;
      e.vy=Math.min(e.vy,900);
      const prevY=e.y;
      e.x+=e.vx*dt;
      e.y+=e.vy*dt;
      e.onGround=false;
      for(const p of platforms){
        const res=resolveAABB(e,p,prevY);
        if(res==='top') e.onGround=true;
      }
      for(const b of bricks){
        if(b.broken) continue;
        const res=resolveAABB(e,b,prevY);
        if(res==='top') e.onGround=true;
      }
      // Turn at edges
      const checkX = e.vx>0 ? e.x+e.w+2 : e.x-2;
      let hasGround=false;
      for(const p of platforms){
        if(checkX>=p.x && checkX<=p.x+p.w && e.y+e.h>=p.y-4 && e.y+e.h<=p.y+p.h+4){
          hasGround=true; break;
        }
      }
      if(!hasGround && e.onGround) e.vx=-e.vx;
      if(e.x<0){ e.x=0; e.vx=Math.abs(e.vx); }
    }

    // Player stomp / side collision
    if(overlaps(player,e) && player.invincible<=0 && respawnTimer<=0){
      const playerBottom=player.y+player.h;
      const enemyTop=e.y;
      if(playerBottom-enemyTop<20 && player.vy>0){
        e.alive=false;
        player.vy=JUMP_POWER*0.5;
        score+=50;
        spawnParticles(e.x+e.w/2, e.y+e.h/2, '#FFD700', 6, 150);
        shake(3,0.15);
      } else {
        playerHit();
      }
    }
  }
}

// ── Floating coins ────────────────────────────────────────────────────────────
function updateFloatingCoins(dt){
  for(let i=floatingCoins.length-1;i>=0;i--){
    const c=floatingCoins[i];
    c.wy+=c.vy*dt;
    c.vy+=500*dt;
    c.life-=dt*1.2;
    if(c.life<=0) floatingCoins.splice(i,1);
  }
}

// ── Fishbread items ───────────────────────────────────────────────────────────
function updateFishbreads(dt){
  for(let i=fishbreads.length-1;i>=0;i--){
    const fb=fishbreads[i];
    if(!fb.active){ fishbreads.splice(i,1); continue; }
    // Float up then settle on a platform or float in place
    if(fb.vy!==0){
      fb.wy+=fb.vy*dt;
      fb.vy+=800*dt; // gravity
      if(fb.vy>=0){
        // Check if landed on something
        let landed=false;
        for(const p of platforms){
          if(fb.wx>=p.x && fb.wx<=p.x+p.w && fb.wy+fb.h/2>=p.y && fb.wy+fb.h/2<=p.y+p.h+10){
            fb.wy=p.y-fb.h/2;
            fb.vy=0;
            landed=true;
            break;
          }
        }
        if(!landed){
          for(const b of bricks){
            if(!b.broken && fb.wx>=b.x && fb.wx<=b.x+b.w && fb.wy+fb.h/2>=b.y && fb.wy+fb.h/2<=b.y+b.h+10){
              fb.wy=b.y-fb.h/2;
              fb.vy=0;
              landed=true;
              break;
            }
          }
        }
        // If below screen, remove
        if(fb.wy>H+60){ fishbreads.splice(i,1); continue; }
      }
    } else {
      // Bob gently
      fb.bobPhase+=dt*2;
      fb.wy+=Math.sin(fb.bobPhase)*0.4;
    }
  }
}

// ── Moving platforms ──────────────────────────────────────────────────────────
function updateMovingPlatforms(dt){
  for(const p of platforms){
    if(!p.moving) continue;
    const prevX=p.x;
    p.x+=p.vx*dt;
    if(p.x>p.ox+p.range){ p.x=p.ox+p.range; p.vx=-Math.abs(p.vx); }
    if(p.x<p.ox){ p.x=p.ox; p.vx=Math.abs(p.vx); }
    const dx=p.x-prevX;
    const px=player.x, py=player.y;
    const onThisPlatform=(px+player.w>p.x && px<p.x+p.w && py+player.h>=p.y-2 && py+player.h<=p.y+p.h+4);
    if(onThisPlatform) player.x+=dx;
  }
}

function updateBoss(dt){
  if(!boss.alive || bossIntro) return;
  boss.capePhase+=dt*2;

  if(boss.stunTime>0){
    boss.stunTime-=dt;
    return;
  }

  boss.x+=boss.vx*dt;
  if(boss.x>boss.ox+boss.range){ boss.x=boss.ox+boss.range; boss.vx=-Math.abs(boss.vx); }
  if(boss.x<boss.ox){ boss.x=boss.ox; boss.vx=Math.abs(boss.vx); }

  boss.fireTimer-=dt;
  if(boss.fireTimer<=0){
    boss.fireTimer=3;
    const bcx=boss.x+boss.w/2, bcy=boss.y+boss.h/2;
    const pcx=player.x+player.w/2, pcy=player.y+player.h/2;
    const dx=pcx-bcx, dy=pcy-bcy;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const spd=200;
    projectiles.push({wx:bcx, wy:bcy, vx:dx/dist*spd, vy:dy/dist*spd, r:14, life:6});
  }

  if(overlaps(player,boss) && player.invincible<=0 && respawnTimer<=0){
    const playerBottom=player.y+player.h;
    const bossTop=boss.y;
    if(playerBottom-bossTop<24 && player.vy>0){
      boss.hp--;
      boss.stunTime=1.5;
      player.vy=JUMP_POWER*0.6;
      shake(6,0.3);
      spawnParticles(boss.x+boss.w/2, boss.y+boss.h/2, '#BF5FFF', 8, 200);
      if(boss.hp<=0){
        boss.alive=false;
        gameState='WIN';
        calcWinScore();
      }
    } else {
      playerHit();
    }
  }

  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.wx+=pr.vx*dt;
    pr.wy+=pr.vy*dt;
    pr.life-=dt;
    if(pr.life<=0){ projectiles.splice(i,1); continue; }
    const prRect={x:pr.wx-pr.r, y:pr.wy-pr.r, w:pr.r*2, h:pr.r*2};
    if(overlaps(player,prRect) && player.invincible<=0){
      playerHit();
      projectiles.splice(i,1);
    }
  }
}

function calcWinScore(){
  const hpBonus=lives*200;
  const timeBonus=Math.floor(timer)*5;
  winScore=score+hpBonus+timeBonus;
  if(winScore>=3000) winRank='S';
  else if(winScore>=2000) winRank='A';
  else if(winScore>=1000) winRank='B';
  else winRank='C';
}

// ── Camera ────────────────────────────────────────────────────────────────────
function updateCamera(){
  const targetX=player.x-W/3;
  camera.x=Math.max(0,Math.min(STAGE_WIDTH-W,targetX));
}

function getZone(worldX){
  if(worldX<2400) return 'forest';
  if(worldX<4800) return 'ocean';
  return 'starsky';
}

function drawBackground(time){
  const cx=camera.x;
  const zone=getZone(cx+W/2);

  // Sky gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  if(zone==='forest'){
    grad.addColorStop(0,'#1a3a0a'); grad.addColorStop(1,'#2D6A2D');
  } else if(zone==='ocean'){
    grad.addColorStop(0,'#0D1B4B'); grad.addColorStop(0.5,'#1B4D3E'); grad.addColorStop(1,'#1A6FA8');
  } else {
    grad.addColorStop(0,'#020818'); grad.addColorStop(0.6,'#0D1B4B'); grad.addColorStop(1,'#1A3060');
  }
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Backdrop image
  if(imgs.backdrop){
    const bw=imgs.backdrop.width||1600;
    const bh=imgs.backdrop.height||600;
    const scale=H/bh;
    const sw=bw*scale;
    const scrollFrac=cx/(STAGE_WIDTH-W)||0;
    const bx=-scrollFrac*(sw-W);
    ctx.globalAlpha=0.35;
    ctx.drawImage(imgs.backdrop,bx,0,sw,H);
    ctx.globalAlpha=1;
  }

  // Stars
  if(zone!=='forest'){
    for(const s of stars){
      const sx=s.wx-cx;
      if(sx<-5||sx>W+5) continue;
      const alpha=0.4+0.6*Math.abs(Math.sin(time*1.5+s.phase));
      ctx.globalAlpha=alpha;
      ctx.fillStyle='#F5F0E8';
      ctx.beginPath(); ctx.arc(sx,s.wy,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Fireflies
  if(zone==='forest'){
    for(const f of fireflies){
      const fx=f.wx-cx+Math.sin(time*f.speed+f.phase)*30;
      const fy=f.wy+Math.cos(time*f.speed*0.7+f.phase)*20;
      if(fx<-10||fx>W+10) continue;
      ctx.globalAlpha=0.4+0.5*Math.abs(Math.sin(time*2+f.phase));
      ctx.fillStyle='#AAFFAA';
      ctx.beginPath(); ctx.arc(fx,fy,2.5,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // Ocean waves
  if(zone==='ocean'||zone==='starsky'){
    for(let w=0;w<3;w++){
      ctx.strokeStyle=`rgba(26,111,168,${0.3-w*0.08})`;
      ctx.lineWidth=2+w;
      ctx.beginPath();
      for(let px2=0;px2<W;px2+=4){
        const wy=H-60-w*15+Math.sin((px2+cx*0.3+time*60*(w+1))*0.02)*8;
        if(px2===0) ctx.moveTo(px2,wy); else ctx.lineTo(px2,wy);
      }
      ctx.stroke();
    }
  }

  // Trees (forest)
  if(zone==='forest'){
    for(let tx=Math.floor(cx/120)*120-120; tx<cx+W+120; tx+=120){
      const sx=tx-cx;
      const th=80+Math.sin(tx*0.1)*20;
      ctx.fillStyle='rgba(20,60,10,0.6)';
      ctx.fillRect(sx+20,H-80-th,20,th);
      ctx.fillStyle='rgba(20,80,10,0.5)';
      ctx.beginPath(); ctx.arc(sx+30,H-80-th,35,0,Math.PI*2); ctx.fill();
    }
  }
}

// ── Player draw ───────────────────────────────────────────────────────────────
function drawPlayerCanvas(c, x, y, w, h, frame, isJumping, facingRight){
  // Fallback canvas-drawn cat
  const cx2=x+w/2, cy=y+h/2;

  // Body
  const bodyGrad=c.createRadialGradient(cx2,cy,h*0.05,cx2,cy,h*0.5);
  bodyGrad.addColorStop(0,'#F4813A');
  bodyGrad.addColorStop(0.6,'#E06820');
  bodyGrad.addColorStop(1,'#C45A1A');
  c.fillStyle=bodyGrad;
  c.beginPath(); c.ellipse(cx2,cy+h*0.08,w*0.38,h*0.36,0,0,Math.PI*2); c.fill();

  // White belly
  c.fillStyle='#FFF5E0';
  c.beginPath(); c.ellipse(cx2,cy+h*0.14,w*0.22,h*0.22,0,0,Math.PI*2); c.fill();

  // Stripes
  c.strokeStyle='#C45A1A'; c.lineWidth=2;
  c.beginPath(); c.moveTo(cx2-w*0.12,cy-h*0.05); c.lineTo(cx2-w*0.28,cy+h*0.10); c.stroke();
  c.beginPath(); c.moveTo(cx2+w*0.12,cy-h*0.05); c.lineTo(cx2+w*0.28,cy+h*0.10); c.stroke();

  // Head
  c.fillStyle='#F4813A';
  c.beginPath(); c.arc(cx2,y+h*0.28,h*0.26,0,Math.PI*2); c.fill();

  // Ears
  c.fillStyle='#F4813A';
  c.beginPath(); c.moveTo(cx2-w*0.22,y+h*0.14); c.lineTo(cx2-w*0.32,y-h*0.04); c.lineTo(cx2-w*0.10,y+h*0.10); c.fill();
  c.beginPath(); c.moveTo(cx2+w*0.22,y+h*0.14); c.lineTo(cx2+w*0.32,y-h*0.04); c.lineTo(cx2+w*0.10,y+h*0.10); c.fill();
  c.fillStyle='#FF9999';
  c.beginPath(); c.moveTo(cx2-w*0.20,y+h*0.12); c.lineTo(cx2-w*0.27,y+h*0.02); c.lineTo(cx2-w*0.12,y+h*0.10); c.fill();
  c.beginPath(); c.moveTo(cx2+w*0.20,y+h*0.12); c.lineTo(cx2+w*0.27,y+h*0.02); c.lineTo(cx2+w*0.12,y+h*0.10); c.fill();

  // Eyes
  c.fillStyle='#222';
  c.beginPath(); c.arc(cx2-w*0.12,y+h*0.26,h*0.055,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx2+w*0.12,y+h*0.26,h*0.055,0,Math.PI*2); c.fill();
  c.fillStyle='#fff';
  c.beginPath(); c.arc(cx2-w*0.10,y+h*0.24,h*0.022,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx2+w*0.14,y+h*0.24,h*0.022,0,Math.PI*2); c.fill();

  // Nose
  c.fillStyle='#FF6699';
  c.beginPath(); c.arc(cx2,y+h*0.32,h*0.028,0,Math.PI*2); c.fill();

  // Whiskers
  c.strokeStyle='#fff'; c.lineWidth=1;
  c.beginPath(); c.moveTo(cx2-w*0.04,y+h*0.33); c.lineTo(cx2-w*0.30,y+h*0.30); c.stroke();
  c.beginPath(); c.moveTo(cx2-w*0.04,y+h*0.35); c.lineTo(cx2-w*0.30,y+h*0.36); c.stroke();
  c.beginPath(); c.moveTo(cx2+w*0.04,y+h*0.33); c.lineTo(cx2+w*0.30,y+h*0.30); c.stroke();
  c.beginPath(); c.moveTo(cx2+w*0.04,y+h*0.35); c.lineTo(cx2+w*0.30,y+h*0.36); c.stroke();

  // Tail
  c.strokeStyle='#C45A1A'; c.lineWidth=5;
  c.beginPath();
  c.moveTo(cx2-w*0.30,y+h*0.72);
  c.bezierCurveTo(cx2-w*0.55,y+h*0.55,cx2-w*0.60,y+h*0.30,cx2-w*0.38,y+h*0.20);
  c.stroke();
  c.strokeStyle='#F4813A'; c.lineWidth=3;
  c.beginPath();
  c.moveTo(cx2-w*0.30,y+h*0.72);
  c.bezierCurveTo(cx2-w*0.55,y+h*0.55,cx2-w*0.60,y+h*0.30,cx2-w*0.38,y+h*0.20);
  c.stroke();

  // Legs
  const legW=w*0.14, legH=h*0.22;
  const legY=y+h*0.80;
  c.fillStyle='#F4813A';
  if(isJumping){
    // Tucked legs
    c.save(); c.translate(cx2-w*0.12, legY); c.rotate(-0.6);
    c.fillRect(-legW/2,0,legW,legH*0.7); c.restore();
    c.save(); c.translate(cx2+w*0.12, legY); c.rotate(0.6);
    c.fillRect(-legW/2,0,legW,legH*0.7); c.restore();
  } else if(frame===0){
    c.fillRect(cx2-w*0.20, legY, legW, legH);
    c.fillRect(cx2+w*0.04, legY, legW, legH);
  } else if(frame===1){
    c.save(); c.translate(cx2-w*0.12, legY+legH*0.5); c.rotate(-0.5);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
    c.save(); c.translate(cx2+w*0.12, legY+legH*0.5); c.rotate(0.5);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
  } else {
    c.save(); c.translate(cx2-w*0.12, legY+legH*0.5); c.rotate(0.5);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
    c.save(); c.translate(cx2+w*0.12, legY+legH*0.5); c.rotate(-0.5);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
  }
}

// Pick the right sprite image based on player state
function getPlayerSprite(){
  if(player.isJumping){
    return imgs.playerJump || imgs.player || null;
  }
  if(player.walkFrame===1){
    return imgs.playerWalk1 || imgs.player || null;
  }
  if(player.walkFrame===2){
    return imgs.playerWalk2 || imgs.player || null;
  }
  return imgs.player || null;
}

function drawPlayer(time){
  if(respawnTimer>0) return;
  if(player.invincible>0 && Math.floor(player.invincible*10)%2===0) return;
  const sx=player.x-camera.x;
  const sy=player.y;
  const pw=player.w, ph=player.h;
  ctx.save();
  ctx.translate(sx+pw/2, sy+ph/2);
  ctx.scale(player.facingRight?1:-1, player.scaleY);
  ctx.translate(-pw/2, -ph/2);

  // Big glow effect
  if(player.big){
    ctx.shadowColor='#FFD700';
    ctx.shadowBlur=16;
  }

  const sprite=getPlayerSprite();
  if(sprite){
    ctx.drawImage(sprite, 0, 0, pw, ph);
  } else {
    drawPlayerCanvas(ctx, 0, 0, pw, ph, player.walkFrame, player.isJumping, true);
  }

  // Big indicator: small star above head
  if(player.big){
    ctx.shadowBlur=0;
    ctx.fillStyle='#FFD700';
    ctx.font='bold 14px Arial';
    ctx.textAlign='center';
    ctx.fillText('★', pw/2, -6);
  }

  ctx.restore();
}

// ── Monster draw functions ────────────────────────────────────────────────────

function drawSlime(c, x, y, w, h, frame, blinkTimer){
  // Bouncy green blob
  const cx2=x+w/2;
  const squish = frame===1 ? 0.85 : (frame===2 ? 1.15 : 1.0);
  const stretchY = 1/squish;
  c.save();
  c.translate(cx2, y+h);
  c.scale(squish, stretchY);
  c.translate(-cx2, -(y+h));

  // Body
  const g=c.createRadialGradient(cx2, y+h*0.5, h*0.05, cx2, y+h*0.5, h*0.55);
  g.addColorStop(0,'#88EE44');
  g.addColorStop(1,'#336622');
  c.fillStyle=g;
  c.beginPath();
  c.ellipse(cx2, y+h*0.6, w*0.44, h*0.42, 0, 0, Math.PI*2); c.fill();
  // Shine
  c.fillStyle='rgba(255,255,255,0.4)';
  c.beginPath(); c.ellipse(cx2-w*0.12, y+h*0.35, w*0.12, h*0.10, -0.4, 0, Math.PI*2); c.fill();

  // Eyes
  const eyeOpen = blinkTimer>0.15;
  c.fillStyle='#fff';
  c.beginPath(); c.arc(cx2-w*0.14, y+h*0.48, h*0.10, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx2+w*0.14, y+h*0.48, h*0.10, 0, Math.PI*2); c.fill();
  c.fillStyle='#111';
  if(eyeOpen){
    c.beginPath(); c.arc(cx2-w*0.14, y+h*0.50, h*0.065, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx2+w*0.14, y+h*0.50, h*0.065, 0, Math.PI*2); c.fill();
  } else {
    c.lineWidth=2; c.strokeStyle='#111';
    c.beginPath(); c.moveTo(cx2-w*0.20, y+h*0.50); c.lineTo(cx2-w*0.08, y+h*0.50); c.stroke();
    c.beginPath(); c.moveTo(cx2+w*0.08, y+h*0.50); c.lineTo(cx2+w*0.20, y+h*0.50); c.stroke();
  }
  // Smile
  c.strokeStyle='#224411'; c.lineWidth=2;
  c.beginPath(); c.arc(cx2, y+h*0.60, w*0.12, 0.2, Math.PI-0.2); c.stroke();

  // Tiny arms
  c.fillStyle='#55BB22';
  c.beginPath(); c.ellipse(cx2-w*0.44, y+h*0.55, w*0.10, h*0.08, -0.5, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(cx2+w*0.44, y+h*0.55, w*0.10, h*0.08, 0.5, 0, Math.PI*2); c.fill();

  c.restore();
}

function drawMushroom(c, x, y, w, h, frame, blinkTimer){
  // Red mushroom with white spots, walking legs
  const cx2=x+w/2;

  // Legs - 3 frames
  c.fillStyle='#DDAA88';
  const legW=w*0.16, legH=h*0.28;
  const legY=y+h*0.72;
  if(frame===0){
    c.fillRect(cx2-w*0.20, legY, legW, legH);
    c.fillRect(cx2+w*0.04, legY, legW, legH);
  } else if(frame===1){
    c.save(); c.translate(cx2-w*0.12, legY+legH*0.5); c.rotate(-0.4);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
    c.save(); c.translate(cx2+w*0.12, legY+legH*0.5); c.rotate(0.4);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
  } else {
    c.save(); c.translate(cx2-w*0.12, legY+legH*0.5); c.rotate(0.4);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
    c.save(); c.translate(cx2+w*0.12, legY+legH*0.5); c.rotate(-0.4);
    c.fillRect(-legW/2,-legH*0.5,legW,legH); c.restore();
  }

  // Body (stem)
  c.fillStyle='#EECC99';
  c.beginPath(); c.ellipse(cx2, y+h*0.70, w*0.32, h*0.28, 0, 0, Math.PI*2); c.fill();

  // Cap
  c.fillStyle='#CC2222';
  c.beginPath();
  c.moveTo(x-w*0.08, y+h*0.46);
  c.bezierCurveTo(x-w*0.08, y-h*0.05, x+w*1.08, y-h*0.05, x+w*1.08, y+h*0.46);
  c.closePath(); c.fill();

  // White spots on cap
  c.fillStyle='#FFFFFF';
  c.beginPath(); c.arc(cx2, y+h*0.18, w*0.10, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx2-w*0.22, y+h*0.28, w*0.07, 0, Math.PI*2); c.fill();
  c.beginPath(); c.arc(cx2+w*0.22, y+h*0.28, w*0.07, 0, Math.PI*2); c.fill();

  // Face
  const eyeOpen = blinkTimer>0.15;
  c.fillStyle='#222';
  if(eyeOpen){
    c.beginPath(); c.arc(cx2-w*0.12, y+h*0.50, h*0.055, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx2+w*0.12, y+h*0.50, h*0.055, 0, Math.PI*2); c.fill();
  } else {
    c.lineWidth=2; c.strokeStyle='#222';
    c.beginPath(); c.moveTo(cx2-w*0.18, y+h*0.50); c.lineTo(cx2-w*0.06, y+h*0.50); c.stroke();
    c.beginPath(); c.moveTo(cx2+w*0.06, y+h*0.50); c.lineTo(cx2+w*0.18, y+h*0.50); c.stroke();
  }
  // Angry brows
  c.strokeStyle='#222'; c.lineWidth=2;
  c.beginPath(); c.moveTo(cx2-w*0.20, y+h*0.43); c.lineTo(cx2-w*0.06, y+h*0.46); c.stroke();
  c.beginPath(); c.moveTo(cx2+w*0.20, y+h*0.43); c.lineTo(cx2+w*0.06, y+h*0.46); c.stroke();
  // Mouth
  c.strokeStyle='#222'; c.lineWidth=1.5;
  c.beginPath(); c.arc(cx2, y+h*0.58, w*0.10, 0.1, Math.PI-0.1, true); c.stroke();
}

function drawGhost(c, x, y, w, h, frame, blinkTimer, time){
  // Translucent blue ghost, floating
  const cx2=x+w/2;
  const bob=Math.sin((time||0)*2+x*0.01)*4;

  c.save();
  c.globalAlpha=0.82;

  // Body
  const g=c.createRadialGradient(cx2, y+h*0.4+bob, h*0.05, cx2, y+h*0.4+bob, h*0.55);
  g.addColorStop(0,'#AADDFF');
  g.addColorStop(0.6,'#5599CC');
  g.addColorStop(1,'rgba(30,80,180,0)');
  c.fillStyle=g;
  c.beginPath();
  c.arc(cx2, y+h*0.35+bob, w*0.42, Math.PI, 0);
  // Wavy bottom
  const waveAmp=6+Math.sin((time||0)*3)*3;
  c.lineTo(x+w, y+h*0.75+bob);
  c.bezierCurveTo(x+w*0.85, y+h*0.75+bob+waveAmp, x+w*0.70, y+h*0.75+bob-waveAmp, x+w*0.55, y+h*0.75+bob);
  c.bezierCurveTo(x+w*0.40, y+h*0.75+bob+waveAmp, x+w*0.25, y+h*0.75+bob-waveAmp, x+w*0.10, y+h*0.75+bob);
  c.lineTo(x, y+h*0.75+bob);
  c.closePath(); c.fill();

  // Eyes
  const eyeOpen = blinkTimer>0.15;
  c.globalAlpha=1;
  c.fillStyle='#FFFF88';
  if(eyeOpen){
    c.beginPath(); c.arc(cx2-w*0.14, y+h*0.32+bob, h*0.09, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx2+w*0.14, y+h*0.32+bob, h*0.09, 0, Math.PI*2); c.fill();
    c.fillStyle='#222';
    c.beginPath(); c.arc(cx2-w*0.12, y+h*0.33+bob, h*0.055, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx2+w*0.16, y+h*0.33+bob, h*0.055, 0, Math.PI*2); c.fill();
  } else {
    c.strokeStyle='#FFFF88'; c.lineWidth=2;
    c.beginPath(); c.moveTo(cx2-w*0.20, y+h*0.32+bob); c.lineTo(cx2-w*0.08, y+h*0.32+bob); c.stroke();
    c.beginPath(); c.moveTo(cx2+w*0.08, y+h*0.32+bob); c.lineTo(cx2+w*0.20, y+h*0.32+bob); c.stroke();
  }
  // Mouth
  c.strokeStyle='#AADDFF'; c.lineWidth=1.5;
  c.beginPath(); c.arc(cx2, y+h*0.48+bob, w*0.10, 0.2, Math.PI-0.2); c.stroke();

  c.restore();
}

function drawBat(c, x, y, w, h, frame, blinkTimer, time){
  // Dark purple bat, flying with wing animation
  const cx2=x+w/2;
  const bob=Math.sin((time||0)*4+x*0.01)*3;

  // Wings - frame-based flap
  const wingAngle = frame===0 ? -0.3 : (frame===1 ? -0.7 : -0.1);
  c.fillStyle='#4A1A6A';
  // Left wing
  c.save();
  c.translate(cx2-w*0.10, y+h*0.40+bob);
  c.rotate(wingAngle);
  c.beginPath();
  c.moveTo(0,0);
  c.bezierCurveTo(-w*0.55,-h*0.25,-w*0.60,-h*0.05,-w*0.30,h*0.20);
  c.bezierCurveTo(-w*0.15,h*0.25,0,h*0.10,0,0);
  c.fill();
  c.restore();
  // Right wing
  c.save();
  c.translate(cx2+w*0.10, y+h*0.40+bob);
  c.rotate(-wingAngle);
  c.beginPath();
  c.moveTo(0,0);
  c.bezierCurveTo(w*0.55,-h*0.25,w*0.60,-h*0.05,w*0.30,h*0.20);
  c.bezierCurveTo(w*0.15,h*0.25,0,h*0.10,0,0);
  c.fill();
  c.restore();

  // Body
  c.fillStyle='#2A0A3A';
  c.beginPath(); c.ellipse(cx2, y+h*0.50+bob, w*0.26, h*0.28, 0, 0, Math.PI*2); c.fill();

  // Ears
  c.fillStyle='#4A1A6A';
  c.beginPath(); c.moveTo(cx2-w*0.16, y+h*0.28+bob); c.lineTo(cx2-w*0.24, y+h*0.08+bob); c.lineTo(cx2-w*0.06, y+h*0.24+bob); c.fill();
  c.beginPath(); c.moveTo(cx2+w*0.16, y+h*0.28+bob); c.lineTo(cx2+w*0.24, y+h*0.08+bob); c.lineTo(cx2+w*0.06, y+h*0.24+bob); c.fill();

  // Eyes
  const eyeOpen = blinkTimer>0.15;
  c.fillStyle='#FF4444';
  if(eyeOpen){
    c.beginPath(); c.arc(cx2-w*0.10, y+h*0.44+bob, h*0.07, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx2+w*0.10, y+h*0.44+bob, h*0.07, 0, Math.PI*2); c.fill();
  } else {
    c.strokeStyle='#FF4444'; c.lineWidth=2;
    c.beginPath(); c.moveTo(cx2-w*0.16, y+h*0.44+bob); c.lineTo(cx2-w*0.04, y+h*0.44+bob); c.stroke();
    c.beginPath(); c.moveTo(cx2+w*0.04, y+h*0.44+bob); c.lineTo(cx2+w*0.16, y+h*0.44+bob); c.stroke();
  }
  // Fangs
  c.fillStyle='#fff';
  c.beginPath(); c.moveTo(cx2-w*0.08, y+h*0.56+bob); c.lineTo(cx2-w*0.04, y+h*0.64+bob); c.lineTo(cx2, y+h*0.56+bob); c.fill();
  c.beginPath(); c.moveTo(cx2, y+h*0.56+bob); c.lineTo(cx2+w*0.04, y+h*0.64+bob); c.lineTo(cx2+w*0.08, y+h*0.56+bob); c.fill();
}

function drawEnemies(time){
  for(const e of enemies){
    if(!e.alive) continue;
    const sx=e.x-camera.x;
    if(sx+e.w<-10||sx>W+10) continue;
    ctx.save();
    // Flip based on direction
    if(e.type!=='ghost' && e.type!=='slime'){
      ctx.translate(sx+e.w/2, e.y+e.h/2);
      ctx.scale(e.vx>0?1:-1, 1);
      ctx.translate(-e.w/2, -e.h/2);
      const ex=0, ey=0;
      if(e.type==='mushroom') drawMushroom(ctx, ex, ey, e.w, e.h, e.walkFrame, e.blinkTimer);
      else if(e.type==='bat') drawBat(ctx, ex, ey, e.w, e.h, e.walkFrame, e.blinkTimer, time);
    } else {
      if(e.type==='slime') drawSlime(ctx, sx, e.y, e.w, e.h, e.walkFrame, e.blinkTimer);
      else if(e.type==='ghost') drawGhost(ctx, sx, e.y, e.w, e.h, e.walkFrame, e.blinkTimer, time);
    }
    ctx.restore();
  }
}

// ── Boss fallback draw ────────────────────────────────────────────────────────
function drawBossFallback(c, x, y, w, h){
  c.fillStyle='#1A1A2E';
  c.beginPath(); c.ellipse(x+w/2,y+h*0.62,w*0.44,h*0.33,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+w/2,y+h*0.27,h*0.29,0,Math.PI*2); c.fill();
  c.beginPath(); c.moveTo(x+w*0.28,y+h*0.08); c.lineTo(x+w*0.16,y-h*0.06); c.lineTo(x+w*0.4,y+h*0.14); c.fill();
  c.beginPath(); c.moveTo(x+w*0.72,y+h*0.08); c.lineTo(x+w*0.84,y-h*0.06); c.lineTo(x+w*0.6,y+h*0.14); c.fill();
  c.strokeStyle='#FF0000'; c.lineWidth=4;
  c.beginPath(); c.moveTo(x+w*0.24,y+h*0.18); c.lineTo(x+w*0.44,y+h*0.24); c.stroke();
  c.beginPath(); c.moveTo(x+w*0.76,y+h*0.18); c.lineTo(x+w*0.56,y+h*0.24); c.stroke();
  c.fillStyle='#FF3300';
  c.beginPath(); c.arc(x+w*0.37,y+h*0.3,h*0.065,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(x+w*0.63,y+h*0.3,h*0.065,0,Math.PI*2); c.fill();
  c.fillStyle='#FFFFFF';
  c.fillRect(x+w*0.37,y+h*0.43,w*0.09,h*0.09);
  c.fillRect(x+w*0.54,y+h*0.43,w*0.09,h*0.09);
}

function drawBoss(time){
  if(!boss.alive) return;
  const sx=boss.x-camera.x;
  if(sx+boss.w<0||sx>W) return;
  const bw=boss.w, bh=boss.h;
  ctx.save();
  ctx.translate(sx+bw/2, boss.y+bh/2);
  if(boss.stunTime>0) ctx.rotate(Math.sin(boss.stunTime*20)*0.12);
  ctx.translate(-bw/2,-bh/2);
  const capeSwing=Math.sin(boss.capePhase)*14;
  ctx.fillStyle='#6A0DAD';
  ctx.globalAlpha=0.88;
  ctx.beginPath();
  ctx.moveTo(-bw*0.5,bh*0.1);
  ctx.bezierCurveTo(-bw*0.85,bh*0.35+capeSwing,-bw*0.65,bh*0.75,-bw*0.08,bh*0.65);
  ctx.lineTo(bw*0.08,bh*0.65);
  ctx.bezierCurveTo(bw*0.65,bh*0.75,bw*0.85,bh*0.35-capeSwing,bw*0.5,bh*0.1);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  if(imgs.boss){
    ctx.drawImage(imgs.boss, 0, 0, bw, bh);
  } else {
    drawBossFallback(ctx, 0, 0, bw, bh);
  }
  ctx.restore();
}

// ── Draw platforms ────────────────────────────────────────────────────────────
function drawPlatforms(){
  for(const p of platforms){
    const sx=p.x-camera.x;
    if(sx+p.w<0||sx>W) continue;
    if(p.moving){
      ctx.fillStyle='#8B6914';
      ctx.fillRect(sx,p.y,p.w,p.h);
      ctx.fillStyle='#D4A017';
      ctx.fillRect(sx+2,p.y+2,p.w-4,6);
      ctx.fillStyle='#FFD700';
      ctx.fillRect(sx,p.y,p.w,3);
      // Arrow indicator
      ctx.fillStyle='#FFD700';
      ctx.font='10px Arial'; ctx.textAlign='center';
      ctx.fillText('↔', sx+p.w/2, p.y+p.h-4);
    } else {
      ctx.fillStyle='#5A3A1A';
      ctx.fillRect(sx,p.y,p.w,p.h);
      ctx.fillStyle='#7BC44C';
      ctx.fillRect(sx,p.y,p.w,8);
      ctx.fillStyle='#5aaa3a';
      for(let gx=sx+5;gx<sx+p.w-5;gx+=20){
        ctx.fillRect(gx,p.y-4,4,6);
        ctx.fillRect(gx+6,p.y-6,3,8);
      }
    }
  }
}

// ── Draw bricks ───────────────────────────────────────────────────────────────
function drawBricks(){
  for(const b of bricks){
    if(b.broken) continue;
    const sx=b.x-camera.x;
    if(sx+b.w<0||sx>W) continue;
    if(b.hasQ){
      ctx.fillStyle='#F5C518';
      ctx.fillRect(sx,b.y,b.w,b.h);
      ctx.strokeStyle='#C8A000'; ctx.lineWidth=2;
      ctx.strokeRect(sx+1,b.y+1,b.w-2,b.h-2);
      ctx.fillStyle='#fff';
      ctx.font='bold 20px Arial'; ctx.textAlign='center';
      ctx.fillText('?',sx+b.w/2,b.y+b.h*0.75);
    } else {
      ctx.fillStyle='#A0522D';
      ctx.fillRect(sx,b.y,b.w,b.h);
      ctx.strokeStyle='#7A3A1A'; ctx.lineWidth=1;
      ctx.strokeRect(sx,b.y,b.w,b.h);
      ctx.beginPath();
      ctx.moveTo(sx,b.y+b.h/2); ctx.lineTo(sx+b.w,b.y+b.h/2);
      ctx.moveTo(sx+b.w/2,b.y); ctx.lineTo(sx+b.w/2,b.y+b.h/2);
      ctx.moveTo(sx+b.w*0.25,b.y+b.h/2); ctx.lineTo(sx+b.w*0.25,b.y+b.h);
      ctx.moveTo(sx+b.w*0.75,b.y+b.h/2); ctx.lineTo(sx+b.w*0.75,b.y+b.h);
      ctx.stroke();
    }
  }
}

// ── Draw floating coins ───────────────────────────────────────────────────────
function drawFloatingCoins(time){
  for(const c of floatingCoins){
    const sx=c.wx-camera.x;
    if(sx<-20||sx>W+20) continue;
    ctx.save();
    ctx.globalAlpha=Math.min(1,c.life);
    const scaleX=Math.abs(Math.cos(time*4));
    ctx.translate(sx,c.wy);
    ctx.scale(scaleX,1);
    if(imgs.coin){
      ctx.drawImage(imgs.coin,-12,-12,24,24);
    } else {
      ctx.fillStyle='#FFD700';
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#C8A000';
      ctx.font='8px Arial'; ctx.textAlign='center';
      ctx.fillText('🐾',0,3);
    }
    ctx.restore();
  }
}

// ── Draw fishbreads ───────────────────────────────────────────────────────────
function drawFishbreads(time){
  for(const fb of fishbreads){
    if(!fb.active) continue;
    const sx=fb.wx-camera.x;
    if(sx<-40||sx>W+40) continue;
    ctx.save();
    // Gentle bob and glow
    const bob=Math.sin(fb.bobPhase)*3;
    ctx.translate(sx, fb.wy+bob);
    // Glow
    const grd=ctx.createRadialGradient(0,0,0,0,0,28);
    grd.addColorStop(0,'rgba(255,200,80,0.5)');
    grd.addColorStop(1,'rgba(255,200,80,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fill();
    if(imgs.fishbread){
      ctx.drawImage(imgs.fishbread, -fb.w/2, -fb.h/2, fb.w, fb.h);
    } else {
      // Fallback: draw simple fish bread shape
      ctx.fillStyle='#D4892A';
      ctx.beginPath();
      ctx.ellipse(0, 0, fb.w*0.5, fb.h*0.45, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#F5A83A';
      ctx.beginPath();
      ctx.ellipse(-2, -2, fb.w*0.35, fb.h*0.30, 0, 0, Math.PI*2);
      ctx.fill();
      // Tail fin
      ctx.fillStyle='#D4892A';
      ctx.beginPath();
      ctx.moveTo(fb.w*0.42, 0);
      ctx.lineTo(fb.w*0.62, -fb.h*0.28);
      ctx.lineTo(fb.w*0.62, fb.h*0.28);
      ctx.closePath();
      ctx.fill();
      // Eye
      ctx.fillStyle='#222';
      ctx.beginPath(); ctx.arc(-fb.w*0.22, -fb.h*0.08, 3, 0, Math.PI*2); ctx.fill();
      // Label
      ctx.fillStyle='#fff';
      ctx.font='bold 9px Arial'; ctx.textAlign='center';
      ctx.fillText('붕어빵', 0, fb.h*0.55);
    }
    ctx.restore();
  }
}

// ── Draw projectiles ──────────────────────────────────────────────────────────
function drawProjectiles(time){
  for(const pr of projectiles){
    const sx=pr.wx-camera.x;
    if(sx<-30||sx>W+30) continue;
    ctx.save();
    const grd=ctx.createRadialGradient(sx,pr.wy,0,sx,pr.wy,pr.r*2.5);
    grd.addColorStop(0,'rgba(255,110,255,0.9)');
    grd.addColorStop(1,'rgba(191,95,255,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(sx,pr.wy,pr.r*2.5,0,Math.PI*2); ctx.fill();
    if(imgs.magic){
      ctx.drawImage(imgs.magic,sx-pr.r,pr.wy-pr.r*0.5,pr.r*2,pr.r);
    } else {
      ctx.fillStyle='#BF5FFF';
      ctx.beginPath(); ctx.arc(sx,pr.wy,pr.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FF6EFF';
      ctx.beginPath(); ctx.arc(sx,pr.wy,pr.r*0.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── Draw HUD ──────────────────────────────────────────────────────────────────
function drawHeart(x,y,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x,y+4);
  ctx.bezierCurveTo(x,y-4,x-12,y-4,x-12,y+4);
  ctx.bezierCurveTo(x-12,y+12,x,y+18,x,y+18);
  ctx.bezierCurveTo(x,y+18,x+12,y+12,x+12,y+4);
  ctx.bezierCurveTo(x+12,y-4,x,y-4,x,y+4);
  ctx.fill();
}

function drawHUD(){
  ctx.fillStyle='#fff';
  ctx.font='bold 20px Arial';
  ctx.textAlign='left';
  ctx.shadowColor='#000'; ctx.shadowBlur=3;
  ctx.fillText('점수: '+score, 10, 30);

  const tc=Math.ceil(timer);
  ctx.textAlign='center';
  ctx.fillStyle=tc<=30?'#FF4444':'#fff';
  ctx.font='bold 22px Arial';
  ctx.fillText('⏱ '+tc, W/2, 30);

  for(let i=0;i<3;i++){
    drawHeart(W-20-i*32, 14, i<lives?'#FF4444':'#555');
  }

  if((gameState==='BOSS_FIGHT') && boss.alive){
    const barW=220, barH=16;
    const bx=(W-barW)/2, by=48;
    ctx.fillStyle='#333';
    ctx.fillRect(bx,by,barW,barH);
    const frac=boss.hp/boss.maxHp;
    const g=ctx.createLinearGradient(bx,by,bx+barW,by);
    g.addColorStop(0,'#6A0DAD'); g.addColorStop(1,'#BF5FFF');
    ctx.fillStyle=g;
    ctx.fillRect(bx,by,barW*frac,barH);
    ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    ctx.strokeRect(bx,by,barW,barH);
    ctx.fillStyle='#fff'; ctx.font='11px Arial'; ctx.textAlign='center';
    ctx.fillText('보스 체력', W/2, by+barH+12);
  }

  ctx.textAlign='left';
  ctx.fillStyle='#FFD700';
  ctx.font='16px Arial';
  ctx.fillText('🪙 '+Math.floor(score/10), 10, 54);

  // Big cat indicator
  if(player.big && player.bigTimer>0){
    ctx.fillStyle='#FFD700';
    ctx.font='bold 14px Arial';
    ctx.textAlign='left';
    ctx.fillText('★ 붕어빵 파워! ' + Math.ceil(player.bigTimer) + 's', 10, 74);
  }

  ctx.shadowBlur=0;
}

// ── Overlay screens ───────────────────────────────────────────────────────────
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FF4444';
  ctx.font='bold 56px Arial'; ctx.textAlign='center';
  ctx.fillText('GAME OVER', W/2, H/2-40);
  ctx.fillStyle='#fff';
  ctx.font='24px Arial';
  ctx.fillText('점수: '+score, W/2, H/2+10);
  ctx.font='18px Arial';
  ctx.fillText('R 키를 눌러 재시작', W/2, H/2+50);
}

function drawWin(){
  ctx.fillStyle='rgba(0,0,50,0.78)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFD700';
  ctx.font='bold 58px Arial'; ctx.textAlign='center';
  ctx.fillText('CLEAR! 🎉', W/2, H/2-80);
  ctx.fillStyle='#fff';
  ctx.font='26px Arial';
  ctx.fillText('최종 점수: '+winScore, W/2, H/2-20);
  const rankColors={'S':'#FFD700','A':'#FF8C00','B':'#00BFFF','C':'#AAAAAA'};
  ctx.fillStyle=rankColors[winRank]||'#fff';
  ctx.font='bold 70px Arial';
  ctx.fillText('랭크: '+winRank, W/2, H/2+60);
  ctx.fillStyle='#ccc'; ctx.font='16px Arial';
  ctx.fillText('R 키를 눌러 재시작', W/2, H/2+110);
}

function drawBossIntro(){
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#BF5FFF';
  ctx.font='bold 42px Arial'; ctx.textAlign='center';
  ctx.fillText('⚠ 보스 등장! ⚠', W/2, H/2);
  ctx.fillStyle='#fff'; ctx.font='20px Arial';
  ctx.fillText('험악한 냥이 보스!', W/2, H/2+50);
}

function drawFlash(){
  if(flashTime>0){
    if(flashColor==='green'){
      ctx.fillStyle='rgba(0,255,100,0.22)';
    } else {
      ctx.fillStyle='rgba(255,0,0,0.28)';
    }
    ctx.fillRect(0,0,W,H);
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let lastTime=0;
function requestRestart(){ buildLevel(); }

function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/1000, 0.05);
  lastTime=ts;
  const time=ts/1000;

  if(gameState==='PLAYING'||gameState==='BOSS_FIGHT'){
    if(!bossIntro){
      timer-=dt;
      if(timer<=0){ timer=0; gameState='GAME_OVER'; }
    }
    updatePlayer(dt);
    updateEnemies(dt);
    updateMovingPlatforms(dt);
    updateFloatingCoins(dt);
    updateFishbreads(dt);
    updateParticles(dt);
    updateCamera();
    if(gameState==='BOSS_FIGHT') updateBoss(dt);
    if(flashTime>0) flashTime-=dt;
    if(shakeTime>0) shakeTime-=dt;
  }

  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shakeTime>0){
    ctx.translate((Math.random()-0.5)*shakeAmt*2, (Math.random()-0.5)*shakeAmt*2);
  }

  drawBackground(time);
  drawPlatforms();
  drawBricks();
  drawFloatingCoins(time);
  drawFishbreads(time);
  drawEnemies(time);
  if(gameState==='BOSS_FIGHT'||gameState==='WIN') drawBoss(time);
  drawProjectiles(time);
  drawPlayer(time);
  drawParticles();
  drawFlash();
  drawHUD();

  if(bossIntro) drawBossIntro();
  if(gameState==='GAME_OVER') drawGameOver();
  if(gameState==='WIN') drawWin();

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(ts=>{ lastTime=ts; requestAnimationFrame(gameLoop); });

})();
</script>
</body>
</html>
