<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별똥 용사 달리기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
  #gameCanvas { display: block; image-rendering: pixelated; border: 3px solid #444; max-width: 100vw; max-height: 100vh; }
  #instructions { color: #aaa; font-size: 11px; text-align: center; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="640" height="400" aria-label="별똥 용사 달리기 게임 캔버스" role="img"></canvas>
<div id="instructions">
  ← → / A D: 이동 &nbsp;|&nbsp; 스페이스·↑·W: 점프 &nbsp;|&nbsp; 벽돌 아래서 점프: 부수기 &nbsp;|&nbsp; 버섯: 커짐 &nbsp;|&nbsp; 코인: 점수 &nbsp;|&nbsp; 스페이스: 재시작
</div>
<script>
(function(){
'use strict';

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ── Assets ──────────────────────────────────────────────────────────────────
const imgPlayer   = new Image(); imgPlayer.src   = 'assets/player.png';
const imgMonster  = new Image(); imgMonster.src  = 'assets/monster.png';
const imgBackdrop = new Image(); imgBackdrop.src = 'assets/backdrop.png';
const imgMushroom = new Image(); imgMushroom.src = 'assets/mushroom.png';
const imgCoin     = new Image(); imgCoin.src     = 'assets/coin.png';
const imgEnemyFly = new Image(); imgEnemyFly.src = 'assets/enemy-fly.png';
const imgEnemyFast= new Image(); imgEnemyFast.src= 'assets/enemy-fast.png';
const imgEnemyArmor=new Image(); imgEnemyArmor.src='assets/enemy-armor.png';

let playerImgOk=false, monsterImgOk=false, backdropOk=false;
let mushroomImgOk=false, coinImgOk=false;
let enemyFlyOk=false, enemyFastOk=false, enemyArmorOk=false;
imgPlayer.onload   = () => { playerImgOk   = true; };
imgMonster.onload  = () => { monsterImgOk  = true; };
imgBackdrop.onload = () => { backdropOk    = true; };
imgMushroom.onload = () => { mushroomImgOk = true; };
imgCoin.onload     = () => { coinImgOk     = true; };
imgEnemyFly.onload = () => { enemyFlyOk    = true; };
imgEnemyFast.onload= () => { enemyFastOk   = true; };
imgEnemyArmor.onload=() => { enemyArmorOk  = true; };

// ── Constants ────────────────────────────────────────────────────────────────
const TILE           = 32;
const GRAVITY        = 0.55;
const MAX_SPEED      = 6;
const ACCEL          = 0.6;
const FRICTION       = 0.82;
const JUMP_FORCE     = -9;
const JUMP_HOLD_BOOST= -0.3;
const JUMP_HOLD_FRAMES=8;
const BOUNCE_VY      = -5;
const STAGE_TIME     = 90;

// ── Input ────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') && gameState==='DEAD')  restart();
  if ((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') && gameState==='CLEAR') restart();
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') jumpPressed();
  if (e.code==='Space'||e.code.startsWith('Arrow')) e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') jumpReleased();
});

// Touch controls
let touchLeft=false, touchRight=false, touchJump=false;
function makeTouchBtn(label,x,y,w,h,onDown,onUp){return{label,x,y,w,h,onDown,onUp,pressed:false};}
const touchBtns=[
  makeTouchBtn('◀',10,H-80,60,60,()=>{touchLeft=true;},()=>{touchLeft=false;}),
  makeTouchBtn('▶',80,H-80,60,60,()=>{touchRight=true;},()=>{touchRight=false;}),
  makeTouchBtn('점프',W-80,H-80,70,60,()=>{touchJump=true;jumpPressed();},()=>{touchJump=false;jumpReleased();}),
];
function handleTouch(e,isDown){
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const scaleX=W/rect.width, scaleY=H/rect.height;
  for(let t of e.changedTouches){
    const tx=(t.clientX-rect.left)*scaleX;
    const ty=(t.clientY-rect.top)*scaleY;
    for(let btn of touchBtns){
      if(tx>=btn.x&&tx<=btn.x+btn.w&&ty>=btn.y&&ty<=btn.y+btn.h){
        if(isDown)btn.onDown();else btn.onUp();
      }
    }
  }
}
canvas.addEventListener('touchstart',e=>handleTouch(e,true),{passive:false});
canvas.addEventListener('touchend',  e=>handleTouch(e,false),{passive:false});
canvas.addEventListener('touchcancel',e=>handleTouch(e,false),{passive:false});

// ── Level Design ─────────────────────────────────────────────────────────────
// Enemy types: 'normal' | 'fast' | 'fly' | 'armor'
// armor enemies require 2 stomps; fly enemies patrol in the air
function makeMonster(x,y,patrolLeft,patrolRight,speed,facingRight,type){
  type = type||'normal';
  return {
    x, y, patrolLeft, patrolRight,
    vx: facingRight ? Math.abs(speed) : -Math.abs(speed),
    alive: true, squished: false, squishTimer: 0, facingRight,
    type,
    hp: (type==='armor') ? 2 : 1,
    flyBase: y,
    flyPhase: Math.random()*Math.PI*2
  };
}

// ── Brick block helper ────────────────────────────────────────────────────────
// breakable=true: player can break from below by jumping; contains optional item
// item: null | 'coin' | 'mushroom' | 'coins3' (spawns 3 coins)
function makeBrick(x, y, breakable, item){
  return { x, y, w:TILE, h:TILE, breakable: breakable||false, item: item||null,
           broken:false, shakeTimer:0 };
}

function buildLevel(){
  const platforms=[];
  const monsters=[];
  const coins=[];
  const mushrooms=[];
  const bricks=[];

  // Ground segments (with gaps)
  for(let x=0;x<800;x+=TILE)       platforms.push({x,y:H-TILE,w:TILE,h:TILE});
  // Gap 800→864
  for(let x=864;x<1280;x+=TILE)    platforms.push({x,y:H-TILE,w:TILE,h:TILE});
  // Gap 1280→1376
  for(let x=1376;x<1760;x+=TILE)   platforms.push({x,y:H-TILE,w:TILE,h:TILE});
  // Gap 1760→1888
  for(let x=1888;x<2400;x+=TILE)   platforms.push({x,y:H-TILE,w:TILE,h:TILE});
  // Gap 2400→2496
  for(let x=2496;x<3200;x+=TILE)   platforms.push({x,y:H-TILE,w:TILE,h:TILE});

  // Elevated platforms
  platforms.push({x:320, y:H-TILE*3,w:TILE*3,h:TILE});
  platforms.push({x:550, y:H-TILE*3,w:TILE*2,h:TILE});
  platforms.push({x:960, y:H-TILE*3,w:TILE*4,h:TILE});
  platforms.push({x:1100,y:H-TILE*4,w:TILE*2,h:TILE});
  platforms.push({x:1450,y:H-TILE*3,w:TILE*3,h:TILE});
  platforms.push({x:1600,y:H-TILE*4,w:TILE*2,h:TILE});
  platforms.push({x:2000,y:H-TILE*3,w:TILE*3,h:TILE});
  platforms.push({x:2200,y:H-TILE*3,w:TILE*2,h:TILE});
  platforms.push({x:2600,y:H-TILE*3,w:TILE*4,h:TILE});
  platforms.push({x:2800,y:H-TILE*4,w:TILE*2,h:TILE});

  bricks.push(makeBrick(912,  H-TILE*4, true,  'coin'));
  bricks.push(makeBrick(944,  H-TILE*4, true,  null));
  bricks.push(makeBrick(976,  H-TILE*4, false, 'mushroom')); // hidden mushroom block

  bricks.push(makeBrick(1072, H-TILE*5, true,  null));

  bricks.push(makeBrick(1232, H-TILE*4, true,  'coins3'));   // triple coin brick

  bricks.push(makeBrick(1432, H-TILE*5, true,  'coin'));

  bricks.push(makeBrick(1496, H-TILE*5, false, 'mushroom'));

  monsters.push(makeMonster(3060, GY,2900,3150, 2.0, false, 'normal'));

  // ── Coins (scattered at diverse heights and positions) ───────────────────

  coins.push({x:970, y:H-TILE*3-24, w:20,h:20,collected:false});
  coins.push({x:1002,y:H-TILE*3-24, w:20,h:20,collected:false});
  coins.push({x:1460,y:H-TILE*3-24, w:20,h:20,collected:false});
  coins.push({x:2010,y:H-TILE*3-24, w:20,h:20,collected:false});
  coins.push({x:2042,y:H-TILE*3-24, w:20,h:20,collected:false});
  coins.push({x:2610,y:H-TILE*3-24, w:20,h:20,collected:false});
  // High-floating coins (above bricks, reward for breaking)
  coins.push({x:168, y:H-TILE*6,    w:20,h:20,collected:false});
  coins.push({x:200, y:H-TILE*6,    w:20,h:20,collected:false});
  coins.push({x:232, y:H-TILE*6,    w:20,h:20,collected:false});
  coins.push({x:700, y:H-TILE*6,    w:20,h:20,collected:false});
  coins.push({x:1040,y:H-TILE*7,    w:20,h:20,collected:false});
  coins.push({x:1072,y:H-TILE*7,    w:20,h:20,collected:false});
  coins.push({x:1560,y:H-TILE*8,    w:20,h:20,collected:false});
  coins.push({x:2080,y:H-TILE*7,    w:20,h:20,collected:false});
  coins.push({x:2112,y:H-TILE*7,    w:20,h:20,collected:false});
  coins.push({x:3000,y:H-TILE*7,    w:20,h:20,collected:false});

  for(let i=0;i<5;i++) coins.push({x:580+i*24, y:H-TILE*4-i*8, w:20,h:20,collected:false});
  for(let i=0;i<5;i++) coins.push({x:1300+i*24,y:H-TILE*4-i*8, w:20,h:20,collected:false});
  for(let i=0;i<5;i++) coins.push({x:2160+i*24,y:H-TILE*4-i*8, w:20,h:20,collected:false});
  for(let i=0;i<5;i++) coins.push({x:2820+i*24,y:H-TILE*5-i*8, w:20,h:20,collected:false});

  // ── Mushrooms (power-up items at diverse positions) ──────────────────────
  mushrooms.push({x:200,  y:GY-28,         w:28,h:28,collected:false});
  mushrooms.push({x:1000, y:GY-28,         w:28,h:28,collected:false});
  mushrooms.push({x:1800, y:GY-28,         w:28,h:28,collected:false});
  mushrooms.push({x:2700, y:GY-28,         w:28,h:28,collected:false});
  // On elevated platforms
  mushrooms.push({x:560,  y:H-TILE*3-28,   w:28,h:28,collected:false});
  mushrooms.push({x:2200, y:H-TILE*3-28,   w:28,h:28,collected:false});
  // High up (reward for reaching upper platforms)
  mushrooms.push({x:1110, y:H-TILE*4-28,   w:28,h:28,collected:false});
  mushrooms.push({x:1610, y:H-TILE*4-28,   w:28,h:28,collected:false});
  mushrooms.push({x:2810, y:H-TILE*4-28,   w:28,h:28,collected:false});
  // Near gaps (risky to collect)
  mushrooms.push({x:820,  y:H-TILE*2-28,   w:28,h:28,collected:false});
  mushrooms.push({x:1310, y:H-TILE*2-28,   w:28,h:28,collected:false});
  mushrooms.push({x:2440, y:H-TILE*2-28,   w:28,h:28,collected:false});

  const flag={x:3120, y:H-TILE-96};
  return {platforms, monsters, coins, mushrooms, bricks, flag};
}

// ── Game State ───────────────────────────────────────────────────────────────
let gameState='PLAYING';
let player, platforms, monsters, coins, mushrooms, bricks, flag;
let cameraX=0;
let timeLeft=STAGE_TIME;
let score=0;
let particles=[];
let jumpHeld=false, jumpHoldCount=0;
let animFrame=0, animTimer=0;
let flagWave=0;
let lastTime=0;
let coinAnimTimer=0;

function initPlayer(){
  return {
    x:60, y:H-TILE-48,
    w:36, h:48,
    vx:0, vy:0,
    onGround:false,
    facingRight:true,
    animState:'idle',
    big:false,
    bigTimer:0,
    invincible:0,
  };
}

function restart(){
  const level=buildLevel();
  platforms=level.platforms;
  monsters=level.monsters;
  coins=level.coins;
  mushrooms=level.mushrooms;
  bricks=level.bricks;
  flag=level.flag;
  player=initPlayer();
  cameraX=0;
  timeLeft=STAGE_TIME;
  score=0;
  particles=[];
  jumpHeld=false;
  jumpHoldCount=0;
  animFrame=0;
  animTimer=0;
  coinAnimTimer=0;
  gameState='PLAYING';
}

function jumpPressed(){
  if(gameState!=='PLAYING') return;
  if(player.onGround){
    player.vy=JUMP_FORCE;
    player.onGround=false;
    jumpHeld=true;
    jumpHoldCount=0;
  }
}
function jumpReleased(){ jumpHeld=false; }

// ── Collision Helpers ────────────────────────────────────────────────────────
function rectOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function resolvePlayerPlatforms(){
  player.onGround=false;
  for(const p of platforms){
    if(!rectOverlap(player.x,player.y,player.w,player.h,p.x,p.y,p.w,p.h)) continue;
    const overlapLeft  =(player.x+player.w)-p.x;
    const overlapRight =(p.x+p.w)-player.x;
    const overlapTop   =(player.y+player.h)-p.y;
    const overlapBottom=(p.y+p.h)-player.y;
    const minH=Math.min(overlapLeft,overlapRight);
    const minV=Math.min(overlapTop,overlapBottom);
    if(minV<minH){
      if(overlapTop<overlapBottom){
        player.y=p.y-player.h;
        player.vy=0;
        player.onGround=true;
        spawnLandParticles();
      } else {
        player.y=p.y+p.h;
        player.vy=0;
      }
    } else {
      if(overlapLeft<overlapRight){ player.x=p.x-player.w; }
      else { player.x=p.x+p.w; }
      player.vx=0;
    }
  }
}

// ── Brick collision: resolve landing on top + breaking from below ─────────────
function resolvePlayerBricks(){
  for(const b of bricks){
    if(b.broken) continue;
    if(!rectOverlap(player.x,player.y,player.w,player.h,b.x,b.y,b.w,b.h)) continue;

    const overlapLeft  =(player.x+player.w)-b.x;
    const overlapRight =(b.x+b.w)-player.x;
    const overlapTop   =(player.y+player.h)-b.y;
    const overlapBottom=(b.y+b.h)-player.y;
    const minH=Math.min(overlapLeft,overlapRight);
    const minV=Math.min(overlapTop,overlapBottom);

    if(minV<minH){
      if(overlapTop<overlapBottom){
        // Player lands on top of brick
        player.y=b.y-player.h;
        player.vy=0;
        player.onGround=true;
        spawnLandParticles();
      } else {
        // Player hits brick from below (jumping up)
        if(player.vy<0){
          player.y=b.y+b.h;
          player.vy=0;
          hitBrickFromBelow(b);
        }
      }
    } else {
      // Side collision with brick
      if(overlapLeft<overlapRight){ player.x=b.x-player.w; }
      else { player.x=b.x+b.w; }
      player.vx=0;
    }
  }
}

function hitBrickFromBelow(b){
  // Shake animation
  b.shakeTimer=0.25;

  if(b.item){
    // Spawn item from brick
    spawnBrickItem(b);
    b.item=null; // item consumed
    if(!b.breakable){
      // Question block becomes empty after giving item
      b.broken=false; // stays but is now empty (mark as used)
      b.used=true;
      return;
    }
  }

  if(b.breakable){
    // Break the brick!
    b.broken=true;
    spawnBrickParticles(b.x+b.w/2, b.y+b.h/2);
    score+=10;
  }
}

function spawnBrickItem(b){
  const cx=b.x+b.w/2-10;
  const cy=b.y-20;
  if(b.item==='coin'){
    coins.push({x:cx, y:cy, w:20, h:20, collected:false, spawned:true});
    score+=50;
    spawnCoinParticles(b.x+b.w/2, b.y);
  } else if(b.item==='coins3'){
    for(let i=0;i<3;i++){
      coins.push({x:b.x+(i*20)-10, y:b.y-20-i*12, w:20, h:20, collected:false, spawned:true});
    }
    score+=150;
    spawnCoinParticles(b.x+b.w/2, b.y);
  } else if(b.item==='mushroom'){
    mushrooms.push({x:b.x+2, y:b.y-28, w:28, h:28, collected:false, spawned:true});
    spawnMushroomParticles(b.x+b.w/2, b.y);
  }
}

let lastLandY=-9999;
function spawnLandParticles(){
  if(player.y===lastLandY) return;
  lastLandY=player.y;
  for(let i=0;i<5;i++){
    particles.push({x:player.x+player.w/2, y:player.y+player.h,
      vx:(Math.random()-0.5)*4, vy:-Math.random()*3-1,
      life:1, color:'#C8843C', size:4+Math.random()*4});
  }
}

function spawnBrickParticles(bx,by){
  for(let i=0;i<8;i++){
    const angle=(i/8)*Math.PI*2;
    particles.push({x:bx, y:by,
      vx:Math.cos(angle)*(2+Math.random()*4),
      vy:Math.sin(angle)*(2+Math.random()*4)-2,
      life:1.2, color: i%2===0 ? '#C8843C' : '#E8A85C', size:5+Math.random()*5});
  }
}

function spawnStompParticles(mx,my,color){
  color=color||'#F07030';
  for(let i=0;i<8;i++){
    const angle=(i/8)*Math.PI*2;
    particles.push({x:mx, y:my,
      vx:Math.cos(angle)*(2+Math.random()*3),
      vy:Math.sin(angle)*(2+Math.random()*3),
      life:1, color, size:5+Math.random()*4});
  }
}

function spawnCoinParticles(cx,cy){
  for(let i=0;i<6;i++){
    const angle=(i/6)*Math.PI*2;
    particles.push({x:cx, y:cy,
      vx:Math.cos(angle)*(1+Math.random()*2),
      vy:Math.sin(angle)*(1+Math.random()*2)-2,
      life:1, color:'#FFE040', size:4+Math.random()*3});
  }
}

function spawnMushroomParticles(mx,my){
  for(let i=0;i<10;i++){
    const angle=(i/10)*Math.PI*2;
    particles.push({x:mx, y:my,
      vx:Math.cos(angle)*(1+Math.random()*3),
      vy:Math.sin(angle)*(1+Math.random()*3)-1,
      life:1.2, color:'#FF6060', size:6+Math.random()*5});
  }
}

// ── Player size helpers ──────────────────────────────────────────────────────
function growPlayer(){
  if(player.big) return;
  player.y -= 24;
  player.w=48; player.h=72;
  player.big=true;
}

function shrinkPlayer(){
  player.y += 24;
  player.w=36; player.h=48;
  player.big=false;
  player.invincible=2.0;
}

// ── Update ───────────────────────────────────────────────────────────────────
function update(dt){
  if(gameState!=='PLAYING') return;
  dt=Math.min(dt,50);
  const dtF=dt/(1000/60);

  // Timer
  timeLeft-=dt/1000;
  if(timeLeft<=0){ timeLeft=0; die(); return; }

  // Invincibility countdown
  if(player.invincible>0) player.invincible-=dt/1000;

  // Input
  const left =keys['ArrowLeft'] ||keys['KeyA']||touchLeft;
  const right=keys['ArrowRight']||keys['KeyD']||touchRight;

  const maxSpd = player.big ? MAX_SPEED*1.1 : MAX_SPEED;

  if(right){ player.vx+=ACCEL*dtF; player.facingRight=true; }
  else if(left){ player.vx-=ACCEL*dtF; player.facingRight=false; }
  else { player.vx*=Math.pow(FRICTION,dtF); if(Math.abs(player.vx)<0.1) player.vx=0; }
  player.vx=Math.max(-maxSpd,Math.min(maxSpd,player.vx));

  // Jump hold boost
  if(jumpHeld&&jumpHoldCount<JUMP_HOLD_FRAMES){
    player.vy+=JUMP_HOLD_BOOST*dtF;
    jumpHoldCount+=dtF;
  }

  // Gravity
  player.vy+=GRAVITY*dtF;
  player.vy=Math.min(player.vy,18);

  // Move
  player.x+=player.vx*dtF;
  player.y+=player.vy*dtF;

  // Prevent going left of camera
  if(player.x<cameraX){ player.x=cameraX; player.vx=0; }

  // Platform collision
  resolvePlayerPlatforms();

  // Brick collision (breakable overhead blocks)
  resolvePlayerBricks();

  // Camera follows player (right scroll only)
  const targetCam=player.x-W*0.35;
  if(targetCam>cameraX) cameraX=targetCam;

  // Camera left edge kill
  if(player.x+player.w<cameraX){ die(); return; }

  // Fall death
  if(player.y>H+100){ die(); return; }

  // ── Brick shake timers ───────────────────────────────────────────────────
  for(const b of bricks){
    if(b.shakeTimer>0) b.shakeTimer-=dt/1000;
  }

  // ── Monster update ───────────────────────────────────────────────────────
  for(const m of monsters){
    if(!m.alive){
      if(m.squishTimer>0){
        m.squishTimer-=dt/1000;
        if(m.squishTimer<=0) m.squished=false;
      }
      continue;
    }

    if(m.type==='fly'){
      m.flyPhase+=dtF*0.06;
      m.y=m.flyBase+Math.sin(m.flyPhase)*30;
    }

    let spd=Math.abs(m.vx);
    if(m.type==='fast'){
      const dist=Math.abs(player.x-(m.x+16));
      if(dist<200) spd=Math.min(spd*1.02,4.5);
    }
    m.vx=(m.vx>0)?spd:-spd;

    m.x+=m.vx*dtF;
    if(m.x<=m.patrolLeft){  m.x=m.patrolLeft;      m.vx=Math.abs(m.vx);  m.facingRight=true;  }
    if(m.x+32>=m.patrolRight){ m.x=m.patrolRight-32; m.vx=-Math.abs(m.vx); m.facingRight=false; }

    const mw=32, mh=32;
    if(!rectOverlap(player.x,player.y,player.w,player.h,m.x,m.y,mw,mh)) continue;

    const playerBottom=player.y+player.h;
    const monsterMidY=m.y+mh/2;
    if(player.vy>0 && playerBottom<monsterMidY+10){
      m.hp--;
      if(m.hp<=0){
        spawnStompParticles(m.x+mw/2,m.y+mh/2, m.type==='armor'?'#88CC44':m.type==='fast'?'#FF4444':'#F07030');
        m.squished=true;
        m.squishTimer=0.4;
        m.alive=false;
        score+=m.type==='armor'?300:m.type==='fast'?150:100;
      } else {
        spawnStompParticles(m.x+mw/2,m.y+mh/2,'#AAAAAA');
        score+=50;
      }
      player.vy=BOUNCE_VY;
    } else {
      if(player.invincible>0) continue;
      if(player.big){
        shrinkPlayer();
        player.vx=(player.x<m.x)?-4:4;
      } else {
        die(); return;
      }
    }
  }

  // ── Coin collection ──────────────────────────────────────────────────────
  for(const c of coins){
    if(c.collected) continue;
    if(rectOverlap(player.x,player.y,player.w,player.h,c.x,c.y,c.w,c.h)){
      c.collected=true;
      score+=50;
      spawnCoinParticles(c.x+c.w/2,c.y+c.h/2);
    }
  }

  // ── Mushroom collection ──────────────────────────────────────────────────
  for(const mu of mushrooms){
    if(mu.collected) continue;
    if(rectOverlap(player.x,player.y,player.w,player.h,mu.x,mu.y,mu.w,mu.h)){
      mu.collected=true;
      score+=200;
      spawnMushroomParticles(mu.x+mu.w/2,mu.y+mu.h/2);
      growPlayer();
    }
  }

  // ── Flag collision ───────────────────────────────────────────────────────
  const fw=16, fh=96;
  if(rectOverlap(player.x,player.y,player.w,player.h,flag.x,flag.y,fw,fh)){
    stageClear(); return;
  }

  // ── Particles ────────────────────────────────────────────────────────────
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dtF; p.y+=p.vy*dtF;
    p.vy+=0.2*dtF;
    p.life-=0.04*dtF;
    if(p.life<=0) particles.splice(i,1);
  }

  // Animation
  animTimer+=dt;
  if(animTimer>120){ animTimer=0; animFrame=(animFrame+1)%2; }
  coinAnimTimer+=dt;
  flagWave+=dt*0.003;

  // Player anim state
  if(!player.onGround) player.animState='jump';
  else if(Math.abs(player.vx)>0.5) player.animState='run';
  else player.animState='idle';
}

function die(){ gameState='DEAD'; }

function stageClear(){
  const bonus=Math.floor(timeLeft)*10;
  score+=bonus;
  gameState='CLEAR';
}

// ── Draw Helpers ─────────────────────────────────────────────────────────────
function drawBrick(x,y,w,h){
  ctx.fillStyle='#C8843C'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#9B5E28'; ctx.fillRect(x,y,w,2); ctx.fillRect(x,y,2,h);
  ctx.fillStyle='#E8A85C'; ctx.fillRect(x+2,y+2,w-4,3); ctx.fillRect(x+2,y+2,3,h-4);
}

// Draw a question-mark / item brick (golden)
function drawItemBrick(x,y,w,h,used){
  if(used){
    // Empty block (grey)
    ctx.fillStyle='#888888'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#666666'; ctx.fillRect(x,y,w,2); ctx.fillRect(x,y,2,h);
    ctx.fillStyle='#AAAAAA'; ctx.fillRect(x+2,y+2,w-4,3); ctx.fillRect(x+2,y+2,3,h-4);
  } else {
    // Golden question block
    ctx.fillStyle='#E8A820'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#B87010'; ctx.fillRect(x,y,w,2); ctx.fillRect(x,y,2,h);
    ctx.fillStyle='#FFD040'; ctx.fillRect(x+2,y+2,w-4,3); ctx.fillRect(x+2,y+2,3,h-4);
    // "?" mark
    ctx.fillStyle='#7A4800';
    ctx.font='bold 18px "Courier New"';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('?', x+w/2, y+h/2+1);
  }
}

function drawCloud(cx,cy,r){
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx-r*0.7,cy+r*0.3,r*0.7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+r*0.7,cy+r*0.3,r*0.7,0,Math.PI*2); ctx.fill();
}

function drawBackground(){
  if(backdropOk){
    const bw=1024, bh=512;
    const parallax=cameraX*0.2;
    const startX=-((parallax%bw)+bw)%bw;
    for(let x=startX;x<W;x+=bw) ctx.drawImage(imgBackdrop,x,0,bw,H);
  } else {
    // Sky gradient
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#5BB8F5');
    grad.addColorStop(0.6,'#A8D8F0');
    grad.addColorStop(1,'#D0EEF8');
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

    // Sun
    ctx.fillStyle='rgba(255,224,64,0.9)';
    ctx.beginPath(); ctx.arc(W-60,50,28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,224,64,0.3)';
    ctx.beginPath(); ctx.arc(W-60,50,42,0,Math.PI*2); ctx.fill();

    // Mountains (parallax)
    const mOff=(cameraX*0.15)%W;
    ctx.fillStyle='#B8A0D8';
    for(let i=-1;i<3;i++){
      const mx=i*300-mOff;
      ctx.beginPath();
      ctx.moveTo(mx,H-80);
      ctx.lineTo(mx+80,H-180);
      ctx.lineTo(mx+160,H-80);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(mx+120,H-80);
      ctx.lineTo(mx+200,H-160);
      ctx.lineTo(mx+280,H-80);
      ctx.closePath(); ctx.fill();
    }

    // Clouds (parallax)
    const cloudOffset=(cameraX*0.3)%(W*2);
    drawCloud(150-cloudOffset%600,   70, 35);
    drawCloud(400-cloudOffset%700,   50, 28);
    drawCloud(620-cloudOffset%500,   80, 22);
    drawCloud(800-cloudOffset%650,   55, 32);
    drawCloud(1050-cloudOffset%800,  65, 26);
  }
}

function drawPlayer(){
  const cx=player.x-cameraX+player.w/2;
  const cy=player.y+player.h/2;
  ctx.save();
  ctx.translate(cx,cy);
  if(!player.facingRight) ctx.scale(-1,1);

  if(player.invincible>0 && Math.floor(player.invincible*10)%2===0){
    ctx.globalAlpha=0.4; // flicker
  }

  const bobY=(player.animState==='run')?Math.sin(animFrame*Math.PI)*2:0;
  const drawH=player.h+8;
  const drawW=drawH*(248/351);

  if(playerImgOk){
    ctx.drawImage(imgPlayer,-drawW/2,-drawH/2+bobY,drawW,drawH);
  } else {
    drawPlayerFallback();
  }
  ctx.restore();
}

function drawPlayerFallback(){
  const s=player.big?3:2;
  // Hat
  ctx.fillStyle='#E03030';
  ctx.fillRect(-8*s,-10*s,16*s,6*s);
  ctx.fillRect(-6*s,-14*s,12*s,5*s);
  // Face
  ctx.fillStyle='#F5C89A';
  ctx.fillRect(-6*s,-4*s,12*s,8*s);
  // Eyes
  ctx.fillStyle='#1A1A1A';
  ctx.fillRect(-4*s,-2*s,2*s,2*s);
  ctx.fillRect(2*s,-2*s,2*s,2*s);
  // Overalls
  ctx.fillStyle='#3A6FD8';
  ctx.fillRect(-7*s,4*s,14*s,10*s);
  // Legs
  ctx.fillStyle='#C8843C';
  ctx.fillRect(-6*s,14*s,5*s,4*s);
  ctx.fillRect(1*s,14*s,5*s,4*s);
}

function drawMonster(m){
  const mw=32, mh=32;
  const sx=m.x-cameraX;
  const sy=m.y;
  ctx.save();
  ctx.translate(sx+mw/2, sy+mh/2);
  if(!m.facingRight) ctx.scale(-1,1);
  if(m.squished){
    ctx.scale(1,0.3);
    ctx.translate(0,mh*1.1);
  }
  switch(m.type){
    case 'fly':
      if(enemyFlyOk){
        const dw=mw+8, dh=dw*(179/275);
        ctx.drawImage(imgEnemyFly,-dw/2,-dh/2,dw,dh);
      } else { drawFlyFallback(mw,mh); }
      break;
    case 'fast':
      if(enemyFastOk){
        const dw=mw+4, dh=dw*(212/294);
        ctx.drawImage(imgEnemyFast,-dw/2,-dh/2,dw,dh);
      } else { drawFastFallback(mw,mh); }
      break;
    case 'armor':
      if(enemyArmorOk){
        const dw=mw+6, dh=dw*(242/376);
        ctx.drawImage(imgEnemyArmor,-dw/2,-dh/2,dw,dh);
      } else { drawArmorFallback(mw,mh,m.hp); }
      break;
    default: // normal
      if(monsterImgOk){
        const dw=mw+4, dh=dw*(272/299);
        ctx.drawImage(imgMonster,-dw/2,-dh/2,dw,dh);
      } else { drawMonsterFallback(mw,mh); }
  }
  ctx.restore();
}

function drawMonsterFallback(mw,mh){
  const r=mw/2-2;
  ctx.fillStyle='#A0522D';
  ctx.beginPath(); ctx.ellipse(0,2,r,r-2,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6B3010';
  ctx.beginPath(); ctx.ellipse(0,-4,r,r*0.5,0,Math.PI,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-6,-2,4,4,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,-2,4,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1A1A1A';
  ctx.beginPath(); ctx.arc(-5,-1,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(7,-1,2.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#1A1A1A'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-10,-6); ctx.lineTo(-2,-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10,-6); ctx.lineTo(2,-4); ctx.stroke();
  ctx.fillStyle='#6B3010';
  ctx.fillRect(-r,mh/2-6,r-2,6); ctx.fillRect(2,mh/2-6,r-2,6);
}

function drawFlyFallback(mw,mh){
  ctx.fillStyle='#8844CC';
  ctx.beginPath(); ctx.ellipse(0,2,10,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6622AA';
  ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-20,-10); ctx.lineTo(-5,4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(20,-10); ctx.lineTo(5,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FF2222';
  ctx.beginPath(); ctx.arc(-4,0,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,0,3,0,Math.PI*2); ctx.fill();
}

function drawFastFallback(mw,mh){
  ctx.fillStyle='#DD2222';
  ctx.beginPath(); ctx.ellipse(0,2,12,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FF4444';
  for(let i=0;i<5;i++){
    const a=-Math.PI/2+(i-2)*0.4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*10,Math.sin(a)*10-2);
    ctx.lineTo(Math.cos(a+0.15)*14,Math.sin(a+0.15)*14-2);
    ctx.lineTo(Math.cos(a-0.15)*14,Math.sin(a-0.15)*14-2);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-4,1,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,1,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-3,1,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,1,1.5,0,Math.PI*2); ctx.fill();
}

function drawArmorFallback(mw,mh,hp){
  ctx.fillStyle='#DDAA22';
  ctx.beginPath(); ctx.ellipse(0,4,10,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle= hp>1 ? '#228822' : '#885522';
  ctx.beginPath(); ctx.ellipse(0,-2,13,11,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#115511'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-8,-2); ctx.lineTo(8,-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(0,8); ctx.stroke();
  ctx.fillStyle='#AADDAA';
  for(let i=-1;i<=1;i++){
    ctx.beginPath(); ctx.moveTo(i*6,-12); ctx.lineTo(i*6-3,-18); ctx.lineTo(i*6+3,-18); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-4,4,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-3,4,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5,4,1.5,0,Math.PI*2); ctx.fill();
}

// ── Coin drawing ─────────────────────────────────────────────────────────────
function drawCoins(){
  const spin=Math.abs(Math.cos(coinAnimTimer*0.005));
  for(const c of coins){
    if(c.collected) continue;
    const sx=c.x-cameraX;
    if(sx+c.w<0||sx>W) continue;
    ctx.save();
    ctx.translate(sx+c.w/2, c.y+c.h/2);
    ctx.scale(spin,1);
    if(coinImgOk){
      ctx.drawImage(imgCoin,-c.w/2,-c.h/2,c.w,c.h);
    } else {
      ctx.fillStyle='#FFE040';
      ctx.beginPath(); ctx.arc(0,0,c.w/2-1,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFB800';
      ctx.beginPath(); ctx.arc(-2,-2,c.w/2-4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFFF88';
      ctx.beginPath(); ctx.arc(-3,-3,3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── Mushroom drawing ──────────────────────────────────────────────────────────
function drawMushrooms(){
  const bob=Math.sin(coinAnimTimer*0.004)*2;
  for(const mu of mushrooms){
    if(mu.collected) continue;
    const sx=mu.x-cameraX;
    if(sx+mu.w<0||sx>W) continue;
    ctx.save();
    ctx.translate(sx+mu.w/2, mu.y+mu.h/2+bob);
    if(mushroomImgOk){
      ctx.drawImage(imgMushroom,-mu.w/2,-mu.h/2,mu.w,mu.h);
    } else {
      ctx.fillStyle='#CC2222';
      ctx.beginPath(); ctx.arc(0,-4,mu.w/2-1,Math.PI,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-4,mu.w/2-1,0,Math.PI); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(-5,-6,4,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(5,-6,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#F5C89A';
      ctx.fillRect(-5,0,10,8);
      ctx.fillStyle='#DDAA88';
      ctx.fillRect(-5,0,10,2);
    }
    ctx.restore();
  }
}

// ── Brick blocks drawing ──────────────────────────────────────────────────────
function drawBricks(){
  for(const b of bricks){
    if(b.broken) continue;
    const sx=b.x-cameraX;
    if(sx+b.w<0||sx>W) continue;

    // Shake offset when hit
    const shakeY = b.shakeTimer>0 ? Math.sin(b.shakeTimer*60)*3 : 0;

    ctx.save();
    ctx.translate(sx, b.y + shakeY);

    if(!b.breakable){
      // Item / question block (golden)
      drawItemBrick(0, 0, b.w, b.h, b.used||false);
    } else {
      // Breakable brick (brown)
      drawBrick(0, 0, b.w, b.h);
      // Small crack marks to show it's breakable
      ctx.strokeStyle='#7A4010';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(8,6); ctx.lineTo(12,14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(20,8); ctx.lineTo(16,18); ctx.stroke();
    }
    ctx.restore();
  }
}

// ── Enemy type legend ─────────────────────────────────────────────────────────
function drawEnemyLegend(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.fillRect(W-170,35,165,22);
  ctx.fillStyle='#fff';
  ctx.font='10px "Courier New"';
  ctx.textAlign='left';
  ctx.fillText('🟠일반 🔴빠름 🟣날기 🟢갑옷×2',W-165,50);
  ctx.restore();
}

function drawFlag(){
  const fx=flag.x-cameraX;
  const fy=flag.y;
  const poleH=96, poleW=6;
  ctx.fillStyle='#F0F0F0'; ctx.fillRect(fx,fy,poleW,poleH);
  const wave=Math.sin(flagWave)*4;
  ctx.fillStyle='#40C040';
  ctx.beginPath();
  ctx.moveTo(fx+poleW,fy+4);
  ctx.lineTo(fx+poleW+28+wave,fy+14);
  ctx.lineTo(fx+poleW,fy+28);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFE040';
  ctx.beginPath(); ctx.arc(fx+poleW/2,fy,6,0,Math.PI*2); ctx.fill();
}

function drawPlatforms(){
  for(const p of platforms){
    const sx=p.x-cameraX;
    if(sx+p.w<0||sx>W) continue;
    drawBrick(sx,p.y,p.w,p.h);
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-cameraX-p.size/2,p.y-p.size/2,p.size,p.size);
    ctx.restore();
  }
}

function drawHUD(){
  ctx.fillStyle='#fff';
  ctx.font='bold 18px "Courier New"';
  ctx.textAlign='left';
  ctx.fillText('점수: '+score,10,28);

  // Coin count
  const collected=coins.filter(c=>c.collected).length;
  const total=coins.length;
  ctx.fillStyle='#FFE040';
  ctx.font='bold 14px "Courier New"';
  ctx.fillText('🪙 '+collected+'/'+total,10,48);

  // Brick break hint
  ctx.fillStyle='#E8A820';
  ctx.font='11px "Courier New"';
  ctx.fillText('벽돌 아래서 점프!',10,65);

  // Big indicator
  if(player.big){
    ctx.fillStyle='#FF6060';
    ctx.font='bold 14px "Courier New"';
    ctx.fillText('★ 파워업!',10,82);
  }

  const t=Math.ceil(timeLeft);
  const warn=timeLeft<=30;
  ctx.save();
  if(warn){
    ctx.fillStyle='#FF3030';
    const shake=Math.sin(Date.now()*0.015)*2;
    ctx.translate(W/2+shake,0);
  } else {
    ctx.fillStyle='#fff';
    ctx.translate(W/2,0);
  }
  ctx.font='bold 20px "Courier New"';
  ctx.textAlign='center';
  ctx.fillText('⏱ '+t+'초',0,28);
  ctx.restore();

  for(const btn of touchBtns){
    ctx.save();
    ctx.globalAlpha=0.5;
    ctx.fillStyle='#333';
    ctx.beginPath(); ctx.roundRect(btn.x,btn.y,btn.w,btn.h,8); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.font='bold 20px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(btn.label,btn.x+btn.w/2,btn.y+btn.h/2);
    ctx.restore();
  }
}

function drawGameOver(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FF3030';
  ctx.font='bold 52px "Courier New"';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('GAME OVER',W/2,H/2-30);
  ctx.fillStyle='#fff';
  ctx.font='22px "Courier New"';
  ctx.fillText('점수: '+score,W/2,H/2+20);
  ctx.font='18px "Courier New"';
  ctx.fillText('스페이스 / ↑ / W 로 재시작',W/2,H/2+55);
  ctx.restore();
}

function drawStageClear(){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#40C040';
  ctx.font='bold 48px "Courier New"';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('STAGE CLEAR!',W/2,H/2-40);
  ctx.fillStyle='#FFE040';
  ctx.font='bold 30px "Courier New"';
  ctx.fillText('최종 점수: '+score,W/2,H/2+10);
  ctx.fillStyle='#fff';
  ctx.font='18px "Courier New"';
  ctx.fillText('(남은 시간 × 10 보너스 포함)',W/2,H/2+45);
  ctx.fillText('스페이스 / ↑ / W 로 재시작',W/2,H/2+75);
  ctx.restore();
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawPlatforms();
  drawBricks();
  drawFlag();
  drawMushrooms();
  drawCoins();

  for(const m of monsters){
    if(m.squished||m.alive) drawMonster(m);
  }

  drawPlayer();
  drawParticles();
  drawHUD();
  drawEnemyLegend();

  if(gameState==='DEAD')  drawGameOver();
  if(gameState==='CLEAR') drawStageClear();
}

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop(ts){
  const dt=lastTime?Math.min(ts-lastTime,100):16;
  lastTime=ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ── Init ─────────────────────────────────────────────────────────────────────
restart();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
