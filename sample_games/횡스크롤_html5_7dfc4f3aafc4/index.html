<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>루미스와 빈 하늘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0D0D2B; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; }
#touch-controls { display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 10px; justify-content: space-between; align-items: flex-end; pointer-events: none; }
#touch-left { display: flex; gap: 8px; }
.touch-btn { width: 64px; height: 64px; background: rgba(46,196,182,0.35); border: 2px solid #2EC4B6; border-radius: 50%; color: #E8E8FF; font-size: 22px; display: flex; align-items: center; justify-content: center; pointer-events: all; user-select: none; -webkit-user-select: none; cursor: pointer; }
@media (pointer: coarse) { #touch-controls { display: flex; } }
</style>
</head>
<body>
<canvas id="c" width="800" height="480" aria-label="루미스와 빈 하늘 게임 캔버스" role="img"></canvas>
<div id="touch-controls">
  <div id="touch-left">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
  <div class="touch-btn" id="btn-jump">▲</div>
</div>
<script>
// ============================================================
//  루미스와 빈 하늘  —  Super Mario-style platformer
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---- Palette ----
const C = {
  bg:     '#0D0D2B',
  stone:  '#3A3A5C',
  teal:   '#2EC4B6',
  amber:  '#FF5733',
  lumen:  '#E8E8FF',
};

// ---- Assets ----
const IMG = {};
function loadImg(key, src) {
  const img = new Image();
  img.src = src;
  img.onload = () => { IMG[key] = img; };
  img.onerror = () => { IMG[key] = null; };
  return img;
}
loadImg('player',       'assets/player.png');
loadImg('snail',        'assets/snail.png');
loadImg('bat',          'assets/bat.png');
loadImg('starFragment', 'assets/star-fragment.png');
loadImg('starCore',     'assets/star-core.png');
loadImg('backdrop',     'assets/backdrop.png');

// ---- Constants ----
const W = 800, H = 480;
const GRAVITY       = 1400;   // px/s²
const MAX_SPEED     = 220;    // px/s
const ACCEL         = 600;    // px/s²
const FRICTION      = 500;    // px/s² decel
const JUMP_FORCE    = -520;   // initial jump velocity px/s
const JUMP_HOLD_MAX = 0.25;   // seconds
const JUMP_HOLD_ADD = -700;   // extra upward force while held
const STOMP_BOUNCE  = -280;   // px/s after stomp
const PIT_Y         = H + 80; // fall-off threshold
const TILE_H        = 20;     // platform visual height

// ---- Input ----
const keys = {};
const touchState = { left: false, right: false, jump: false };
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup',   e => { keys[e.code] = false; });
function isLeft()  { return keys['ArrowLeft']  || keys['KeyA'] || touchState.left; }
function isRight() { return keys['ArrowRight'] || keys['KeyD'] || touchState.right; }
function isJump()  { return keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touchState.jump; }

// Touch buttons
['btn-left','btn-right','btn-jump'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  const prop = id === 'btn-left' ? 'left' : id === 'btn-right' ? 'right' : 'jump';
  el.addEventListener('pointerdown', e => { e.preventDefault(); touchState[prop] = true; });
  el.addEventListener('pointerup',   e => { e.preventDefault(); touchState[prop] = false; });
  el.addEventListener('pointerleave',e => { e.preventDefault(); touchState[prop] = false; });
});

// ---- Stage Data ----
// Platform: { x, y, w }  (world coords, y = top of platform)
// Enemy snail: { type:'snail', x, y, w:40, h:28, vx:60, dir:1, patrolX1, patrolX2, alive:true }
// Enemy bat:   { type:'bat',   x, y, cx, cy, r:80, angle:0, speed:1.5, alive:true }
// Star:        { x, y, collected:false }
// Core:        { x, y }

function makeStages() {
  return [
    // ---- STAGE 1 ----
    {
      timeLimit: 60,
      worldW: 2400,
      platforms: [
        {x:0,   y:360, w:400},
        {x:460, y:360, w:300},
        {x:820, y:320, w:200},
        {x:1080,y:360, w:350},
        {x:1490,y:360, w:300},
        {x:1850,y:360, w:500},
      ],
      enemies: [
        {type:'snail', x:500, y:332, patrolX1:460, patrolX2:760, dir:1},
        {type:'snail', x:1100,y:332, patrolX1:1080,patrolX2:1430,dir:-1},
      ],
      stars: [
        {x:200,y:320},{x:300,y:320},{x:500,y:300},{x:600,y:300},{x:700,y:300},
        {x:850,y:280},{x:950,y:280},{x:1100,y:300},{x:1200,y:300},{x:1300,y:300},
        {x:1500,y:320},{x:1600,y:320},{x:1700,y:320},{x:1900,y:320},{x:2000,y:320},
      ],
      core: {x:2150, y:320},
      playerStart: {x:80, y:300},
    },
    // ---- STAGE 2 ----
    {
      timeLimit: 50,
      worldW: 2800,
      platforms: [
        {x:0,   y:360, w:300},
        {x:380, y:340, w:200},
        {x:660, y:300, w:160},
        {x:900, y:360, w:250},
        {x:1230,y:320, w:180},
        {x:1490,y:360, w:220},
        {x:1790,y:300, w:160},
        {x:2030,y:360, w:280},
        {x:2390,y:360, w:360},
      ],
      enemies: [
        {type:'snail', x:400, y:312, patrolX1:380, patrolX2:580, dir:1},
        {type:'bat',   cx:800, cy:220, r:80, angle:0, speed:1.8},
        {type:'bat',   cx:1350,cy:200, r:80, angle:Math.PI, speed:1.6},
        {type:'snail', x:2050,y:332, patrolX1:2030,patrolX2:2310,dir:1},
      ],
      stars: [
        {x:150,y:320},{x:250,y:320},
        {x:400,y:300},{x:500,y:300},
        {x:680,y:260},{x:760,y:260},
        {x:950,y:320},{x:1050,y:320},{x:1130,y:320},
        {x:1260,y:280},{x:1340,y:280},
        {x:1520,y:320},{x:1620,y:320},
        {x:1820,y:260},{x:1900,y:260},
        {x:2060,y:320},{x:2160,y:320},{x:2260,y:320},
        {x:2420,y:320},{x:2520,y:320},{x:2620,y:320},
      ],
      core: {x:2680, y:310},
      playerStart: {x:80, y:300},
    },
    // ---- STAGE 3 ----
    {
      timeLimit: 45,
      worldW: 3200,
      platforms: [
        {x:0,   y:360, w:250},
        {x:330, y:340, w:140},
        {x:560, y:300, w:120},
        {x:770, y:340, w:140},
        {x:1000,y:360, w:160},
        {x:1250,y:310, w:120},
        {x:1460,y:360, w:150},
        {x:1710,y:300, w:130},
        {x:1940,y:360, w:160},
        {x:2200,y:320, w:140},
        {x:2440,y:360, w:180},
        {x:2720,y:310, w:160},
        {x:2980,y:360, w:180},
      ],
      enemies: [
        {type:'snail', x:350, y:312, patrolX1:330, patrolX2:470, dir:1},
        {type:'bat',   cx:650, cy:220, r:80, angle:0, speed:2.0},
        {type:'snail', x:1020,y:332, patrolX1:1000,patrolX2:1160,dir:1},
        {type:'bat',   cx:1350,cy:200, r:80, angle:Math.PI, speed:2.2},
        {type:'snail', x:1730,y:272, patrolX1:1710,patrolX2:1840,dir:-1},
        {type:'bat',   cx:2300,cy:210, r:80, angle:0.5, speed:2.0},
        {type:'snail', x:2460,y:332, patrolX1:2440,patrolX2:2620,dir:1},
      ],
      stars: [
        {x:100,y:320},{x:180,y:320},
        {x:360,y:300},{x:430,y:300},
        {x:590,y:260},{x:650,y:260},
        {x:800,y:300},{x:870,y:300},
        {x:1030,y:320},{x:1100,y:320},
        {x:1280,y:270},{x:1340,y:270},
        {x:1490,y:320},{x:1560,y:320},
        {x:1740,y:260},{x:1800,y:260},
        {x:1970,y:320},{x:2040,y:320},
        {x:2230,y:280},{x:2290,y:280},
        {x:2470,y:320},{x:2550,y:320},
        {x:2750,y:270},{x:2820,y:270},
        {x:3010,y:320},{x:3090,y:320},
      ],
      core: {x:3100, y:310},
      playerStart: {x:80, y:300},
    },
  ];
}

// ---- Particles ----
let particles = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 80 + Math.random() * 120;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 60,
      life: 0.6, maxLife: 0.6,
      color, r: 3 + Math.random() * 3,
    });
  }
}
function spawnRipple(x, y) {
  particles.push({ type:'ripple', x, y, r: 4, maxR: 20, life: 0.4, maxLife: 0.4 });
}
function spawnFloatText(x, y, text) {
  particles.push({ type:'text', x, y, vy: -60, text, life: 0.8, maxLife: 0.8 });
}

// ---- Game State ----
let stageIndex = 0;
let stages = makeStages();
let stage, player, enemies, stars, core, camera;
let gameState = 'PLAYING'; // PLAYING | RESTART | STAGE_CLEAR | GAME_CLEAR
let restartTimer = 0;
let stageClearTimer = 0;
let stageTime = 0;
let totalTime = 0;
let starsCollected = 0;
let totalStarsInStage = 0;
let finalGrade = 'C';
let allStarsCollected = 0;
let allStarsTotal = 0;
let allTimeBonus = 0;
let prevJump = false;
let jumpHoldTime = 0;
let isJumping = false;
let onGround = false;

// Stars for background
const bgStars = Array.from({length:100}, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: 0.5 + Math.random() * 1.5,
  seed: Math.random() * Math.PI * 2,
}));

// Parallax islands (canvas-drawn)
const islands1 = [
  {x:100, y:200, pts:[0,0, 200,0, 220,30, 180,40, 10,40, -20,20]},
  {x:500, y:150, pts:[0,0, 150,0, 160,25, 130,35, -10,30]},
  {x:700, y:240, pts:[0,0, 180,0, 190,28, 150,38, 10,38, -15,18]},
];
const islands2 = [
  {x:50,  y:280, pts:[0,0, 300,0, 320,40, 260,55, 20,55, -30,30]},
  {x:550, y:300, pts:[0,0, 250,0, 260,38, 200,50, 10,50, -20,28]},
];

function initStage(idx) {
  stageIndex = idx;
  stage = JSON.parse(JSON.stringify(stages[idx]));
  // Init enemies with proper fields
  stage.enemies = stage.enemies.map(e => {
    if (e.type === 'snail') {
      return { ...e, w:44, h:28, vx:60, alive:true, squashTimer:0 };
    } else {
      return { ...e, w:44, h:28, alive:true };
    }
  });
  stage.stars = stage.stars.map(s => ({ ...s, collected:false }));
  starsCollected = 0;
  totalStarsInStage = stage.stars.length;

  player = {
    x: stage.playerStart.x,
    y: stage.playerStart.y,
    w: 36, h: 36,
    vx: 0, vy: 0,
    onGround: false,
    facingRight: true,
    jumpHeld: false,
    jumpHoldTime: 0,
    canJump: false,
  };
  camera = { x: 0 };
  particles = [];
  stageTime = stage.timeLimit;
  gameState = 'PLAYING';
  prevJump = false;
}

function calcGrade(collectRate, timeBonus) {
  const score = collectRate * 100 + timeBonus;
  if (collectRate >= 1.0 && timeBonus >= 10) return 'S';
  if (score >= 85) return 'S';
  if (score >= 65) return 'A';
  if (score >= 40) return 'B';
  return 'C';
}

// ---- Platform collision ----
function getPlatforms() { return stage.platforms; }

function resolvePlayerPlatforms(p, dt) {
  p.onGround = false;
  const platforms = getPlatforms();
  // Move X
  p.x += p.vx * dt;
  // Clamp to world
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.x + p.w > stage.worldW) { p.x = stage.worldW - p.w; p.vx = 0; }

  // Move Y
  p.y += p.vy * dt;

  for (const pl of platforms) {
    const px1 = p.x, px2 = p.x + p.w;
    const py1 = p.y, py2 = p.y + p.h;
    const plx1 = pl.x, plx2 = pl.x + pl.w;
    const ply = pl.y;

    // Overlap check
    if (px2 > plx1 && px1 < plx2) {
      // Landing on top (was above, now crossing)
      if (py2 >= ply && py2 <= ply + 30 && p.vy >= 0) {
        p.y = ply - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
  }
}

// ---- Update ----
let lastTime = 0;
function update(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  if (gameState === 'RESTART') {
    restartTimer -= dt;
    if (restartTimer <= 0) initStage(stageIndex);
    updateParticles(dt);
    return;
  }
  if (gameState === 'STAGE_CLEAR') {
    stageClearTimer -= dt;
    if (stageClearTimer <= 0) {
      if (stageIndex < 2) {
        allStarsCollected += starsCollected;
        allStarsTotal += totalStarsInStage;
        allTimeBonus += Math.floor(stageTime);
        initStage(stageIndex + 1);
      } else {
        allStarsCollected += starsCollected;
        allStarsTotal += totalStarsInStage;
        allTimeBonus += Math.floor(stageTime);
        const rate = allStarsTotal > 0 ? allStarsCollected / allStarsTotal : 0;
        finalGrade = calcGrade(rate, allTimeBonus);
        gameState = 'GAME_CLEAR';
      }
    }
    updateParticles(dt);
    return;
  }
  if (gameState === 'GAME_CLEAR') {
    if (isJump() && !prevJump) {
      stages = makeStages();
      allStarsCollected = 0; allStarsTotal = 0; allTimeBonus = 0; totalTime = 0;
      initStage(0);
    }
    prevJump = isJump();
    updateParticles(dt);
    return;
  }

  // PLAYING
  stageTime -= dt;
  totalTime += dt;
  if (stageTime <= 0) {
    stageTime = 0;
    triggerRestart();
    return;
  }

  const p = player;

  // Horizontal movement
  if (isLeft()) {
    p.vx -= ACCEL * dt;
    if (p.vx < -MAX_SPEED) p.vx = -MAX_SPEED;
    p.facingRight = false;
  } else if (isRight()) {
    p.vx += ACCEL * dt;
    if (p.vx > MAX_SPEED) p.vx = MAX_SPEED;
    p.facingRight = true;
  } else {
    // Friction
    if (p.vx > 0) { p.vx -= FRICTION * dt; if (p.vx < 0) p.vx = 0; }
    if (p.vx < 0) { p.vx += FRICTION * dt; if (p.vx > 0) p.vx = 0; }
  }

  // Jump
  const jumpPressed = isJump();
  if (jumpPressed && !prevJump && p.onGround) {
    p.vy = JUMP_FORCE;
    p.jumpHeld = true;
    p.jumpHoldTime = 0;
    p.onGround = false;
  }
  if (jumpPressed && p.jumpHeld) {
    p.jumpHoldTime += dt;
    if (p.jumpHoldTime < JUMP_HOLD_MAX) {
      p.vy += JUMP_HOLD_ADD * dt;
    } else {
      p.jumpHeld = false;
    }
  }
  if (!jumpPressed) {
    p.jumpHeld = false;
  }
  prevJump = jumpPressed;

  // Gravity
  p.vy += GRAVITY * dt;
  if (p.vy > 900) p.vy = 900;

  // Platform resolution
  resolvePlayerPlatforms(p, dt);

  // Pit death
  if (p.y > PIT_Y) {
    triggerRestart();
    return;
  }

  // Update enemies
  for (const e of stage.enemies) {
    if (!e.alive) continue;
    if (e.type === 'snail') {
      e.x += e.vx * e.dir * dt;
      if (e.x <= e.patrolX1) { e.x = e.patrolX1; e.dir = 1; }
      if (e.x + e.w >= e.patrolX2) { e.x = e.patrolX2 - e.w; e.dir = -1; }
      // Snail stays on platform y
      e.y = e.y; // already set
    } else if (e.type === 'bat') {
      e.angle += e.speed * dt;
      // U-shape orbit: x = cx + r*cos, y = cy + |r*sin| (only lower half)
      e.x = e.cx + e.r * Math.cos(e.angle) - e.w / 2;
      e.y = e.cy + Math.abs(e.r * Math.sin(e.angle)) - e.h / 2;
    }
  }

  // Enemy collision
  for (const e of stage.enemies) {
    if (!e.alive) continue;
    const ex = e.x, ey = e.y, ew = e.w, eh = e.h;
    const px = p.x, py = p.y, pw = p.w, ph = p.h;
    // AABB overlap
    if (px + pw > ex && px < ex + ew && py + ph > ey && py < ey + eh) {
      // Stomp: player falling, player bottom near enemy top
      const playerBottom = py + ph;
      const enemyTop = ey;
      if (p.vy > 0 && playerBottom - enemyTop < 20 && playerBottom > enemyTop) {
        // Stomp!
        e.alive = false;
        p.vy = STOMP_BOUNCE;
        spawnParticles(ex + ew/2, ey + eh/2, C.stone, 6);
        spawnFloatText(ex + ew/2, ey, '+STOMP');
      } else {
        // Side/bottom hit → death
        triggerRestart();
        return;
      }
    }
  }

  // Star collection
  for (const s of stage.stars) {
    if (s.collected) continue;
    const dx = (p.x + p.w/2) - s.x;
    const dy = (p.y + p.h/2) - s.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 28) {
      s.collected = true;
      starsCollected++;
      spawnRipple(s.x, s.y);
      spawnFloatText(s.x, s.y - 10, '+1');
    }
  }

  // Star core
  const sc = stage.core;
  const cdx = (p.x + p.w/2) - sc.x;
  const cdy = (p.y + p.h/2) - sc.y;
  if (Math.sqrt(cdx*cdx + cdy*cdy) < 36) {
    gameState = 'STAGE_CLEAR';
    stageClearTimer = 1.5;
    spawnParticles(sc.x, sc.y, C.teal, 12);
    spawnParticles(sc.x, sc.y, C.lumen, 8);
  }

  // Camera
  const targetCamX = p.x - W * 0.35;
  camera.x += (targetCamX - camera.x) * 8 * dt;
  if (camera.x < 0) camera.x = 0;
  if (camera.x > stage.worldW - W) camera.x = stage.worldW - W;

  updateParticles(dt);
}

function triggerRestart() {
  gameState = 'RESTART';
  restartTimer = 0.8;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, C.amber, 8);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.type === 'ripple') { p.r += (p.maxR - 4) * dt / p.maxLife * 2; }
    else if (p.type === 'text') { p.y += p.vy * dt; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  }
}

// ---- Render ----
function render(ts) {
  ctx.clearRect(0, 0, W, H);

  // Background
  drawBackground(ts);

  // World transform
  ctx.save();
  ctx.translate(-Math.floor(camera.x), 0);

  // Platforms
  drawPlatforms();

  // Stars
  drawStars(ts);

  // Star core
  drawStarCore(ts);

  // Enemies
  drawEnemies(ts);

  // Player
  drawPlayer(ts);

  // Particles (world space)
  drawParticlesWorld();

  ctx.restore();

  // HUD
  drawHUD(ts);

  // Overlay states
  if (gameState === 'RESTART') {
    drawOverlay('STAGE RESTART', C.amber);
  } else if (gameState === 'STAGE_CLEAR') {
    drawOverlay(`STAGE ${stageIndex + 1} CLEAR!`, C.teal);
  } else if (gameState === 'GAME_CLEAR') {
    drawGameClear();
  }
}

function drawBackground(ts) {
  // Sky
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  // Backdrop image
  if (IMG.backdrop) {
    ctx.globalAlpha = 0.7;
    ctx.drawImage(IMG.backdrop, 0, 0, W, H);
    ctx.globalAlpha = 1;
  } else {
    // Parallax islands layer 1 (far)
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = C.stone;
    const off1 = camera.x * 0.15;
    for (const isl of islands1) {
      ctx.save();
      ctx.translate(isl.x - off1, isl.y);
      ctx.beginPath();
      for (let i = 0; i < isl.pts.length; i += 2) {
        i === 0 ? ctx.moveTo(isl.pts[i], isl.pts[i+1]) : ctx.lineTo(isl.pts[i], isl.pts[i+1]);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // Parallax islands layer 2 (near)
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = C.stone;
    const off2 = camera.x * 0.35;
    for (const isl of islands2) {
      ctx.save();
      ctx.translate(isl.x - off2, isl.y);
      ctx.beginPath();
      for (let i = 0; i < isl.pts.length; i += 2) {
        i === 0 ? ctx.moveTo(isl.pts[i], isl.pts[i+1]) : ctx.lineTo(isl.pts[i], isl.pts[i+1]);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // Background stars (twinkle)
  for (const s of bgStars) {
    const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(ts * 0.001 + s.seed));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.lumen;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPlatforms() {
  for (const pl of stage.platforms) {
    // Body
    ctx.fillStyle = C.stone;
    ctx.fillRect(pl.x, pl.y, pl.w, TILE_H);
    // Teal top strip
    ctx.fillStyle = C.teal;
    ctx.fillRect(pl.x, pl.y, pl.w, 3);
    // Subtle bottom edge
    ctx.fillStyle = '#2A2A4A';
    ctx.fillRect(pl.x, pl.y + TILE_H - 2, pl.w, 2);
  }
}

function drawStars(ts) {
  for (const s of stage.stars) {
    if (s.collected) continue;
    const wx = s.x - camera.x;
    if (wx < -30 || wx > W + 30) continue; // skip off-screen (already in world space)
    const glow = 0.5 + 0.5 * Math.sin(ts * 0.003 + s.x * 0.1);
    if (IMG.starFragment) {
      ctx.save();
      ctx.globalAlpha = 0.7 + 0.3 * glow;
      ctx.drawImage(IMG.starFragment, s.x - 12, s.y - 12, 24, 24);
      ctx.restore();
    } else {
      // Canvas fallback star
      ctx.save();
      ctx.globalAlpha = 0.8 + 0.2 * glow;
      ctx.shadowColor = C.lumen;
      ctx.shadowBlur = 8 * glow;
      drawStar5(s.x, s.y, 10, 5, C.lumen);
      ctx.restore();
    }
  }
}

function drawStar5(cx, cy, r, n, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const angle = (Math.PI / n) * i - Math.PI / 2;
    const radius = i % 2 === 0 ? r : r * 0.4;
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

function drawStarCore(ts) {
  const sc = stage.core;
  const wx = sc.x - camera.x;
  if (wx < -60 || wx > W + 60) return;

  ctx.save();
  // Glow
  const grad = ctx.createRadialGradient(sc.x, sc.y, 0, sc.x, sc.y, 50);
  grad.addColorStop(0, 'rgba(232,232,255,0.6)');
  grad.addColorStop(0.5, 'rgba(46,196,182,0.3)');
  grad.addColorStop(1, 'rgba(13,13,43,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(sc.x, sc.y, 50, 0, Math.PI * 2);
  ctx.fill();

  if (IMG.starCore) {
    ctx.drawImage(IMG.starCore, sc.x - 28, sc.y - 28, 56, 56);
  } else {
    // Rotating rings
    ctx.strokeStyle = C.teal;
    ctx.lineWidth = 2;
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(ts * 0.001 * 0.02 * 60);
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 12, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(-ts * 0.001 * 0.035 * 60);
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 10, Math.PI/4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    // Core
    ctx.fillStyle = C.lumen;
    ctx.shadowColor = C.teal;
    ctx.shadowBlur = 16;
    drawStar5(sc.x, sc.y, 20, 5, C.lumen);
  }
  ctx.restore();
}

function drawEnemies(ts) {
  for (const e of stage.enemies) {
    if (!e.alive) continue;
    if (e.type === 'snail') {
      const wx = e.x - camera.x;
      if (wx < -60 || wx > W + 60) continue;
      if (IMG.snail) {
        ctx.save();
        if (e.dir < 0) {
          ctx.translate(e.x + e.w, e.y);
          ctx.scale(-1, 1);
          ctx.drawImage(IMG.snail, 0, 0, e.w, e.h);
        } else {
          ctx.drawImage(IMG.snail, e.x, e.y, e.w, e.h);
        }
        ctx.restore();
      } else {
        // Canvas fallback
        ctx.fillStyle = C.stone;
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.strokeStyle = C.teal;
        ctx.lineWidth = 2;
        ctx.strokeRect(e.x, e.y, e.w, e.h);
        // Antennae
        ctx.strokeStyle = C.teal;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(e.x + 10, e.y); ctx.lineTo(e.x + 8, e.y - 8);
        ctx.moveTo(e.x + 18, e.y); ctx.lineTo(e.x + 16, e.y - 8);
        ctx.stroke();
      }
    } else if (e.type === 'bat') {
      const wx = e.x - camera.x;
      if (wx < -80 || wx > W + 80) continue;
      const cx = e.x + e.w / 2;
      const cy = e.y + e.h / 2;
      const wingFlap = Math.sin(ts * 0.008) * 6;
      if (IMG.bat) {
        ctx.save();
        ctx.drawImage(IMG.bat, e.x, e.y, e.w, e.h);
        ctx.restore();
      } else {
        // Canvas bat
        ctx.save();
        ctx.fillStyle = '#0D0D2B';
        ctx.strokeStyle = C.stone;
        ctx.lineWidth = 1.5;
        // Left wing
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cx - 20, cy - 10 + wingFlap, cx - 30, cy + 5);
        ctx.quadraticCurveTo(cx - 18, cy + 8, cx, cy + 4);
        ctx.fill(); ctx.stroke();
        // Right wing
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cx + 20, cy - 10 + wingFlap, cx + 30, cy + 5);
        ctx.quadraticCurveTo(cx + 18, cy + 8, cx, cy + 4);
        ctx.fill(); ctx.stroke();
        // Body
        ctx.fillStyle = '#0D0D2B';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 10, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // Eyes
        ctx.fillStyle = C.lumen;
        ctx.shadowColor = C.lumen;
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 2, 2, 0, Math.PI * 2);
        ctx.arc(cx + 4, cy - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

function drawPlayer(ts) {
  const p = player;
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;

  if (IMG.player) {
    ctx.save();
    // Glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, p.w * 1.2);
    grad.addColorStop(0, 'rgba(255,87,51,0.45)');
    grad.addColorStop(1, 'rgba(255,87,51,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, p.w * 1.2, 0, Math.PI * 2);
    ctx.fill();

    if (!p.facingRight) {
      ctx.translate(p.x + p.w, p.y);
      ctx.scale(-1, 1);
      ctx.drawImage(IMG.player, 0, 0, p.w, p.h);
    } else {
      ctx.drawImage(IMG.player, p.x, p.y, p.w, p.h);
    }
    ctx.restore();
  } else {
    // Canvas fallback
    ctx.save();
    // Glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, p.w);
    grad.addColorStop(0, 'rgba(255,87,51,0.5)');
    grad.addColorStop(1, 'rgba(255,87,51,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, p.w, 0, Math.PI * 2);
    ctx.fill();

    // Scarf tail
    const scarfDir = p.facingRight ? -1 : 1;
    const scarfLen = 12 + Math.abs(p.vx) * 0.06;
    ctx.strokeStyle = C.teal;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + scarfDir * (-p.w * 0.3), cy);
    ctx.quadraticCurveTo(cx + scarfDir * scarfLen, cy - 4, cx + scarfDir * (scarfLen * 1.5), cy + 6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + scarfDir * (-p.w * 0.3), cy + 4);
    ctx.quadraticCurveTo(cx + scarfDir * (scarfLen * 0.8), cy + 2, cx + scarfDir * (scarfLen * 1.3), cy + 10);
    ctx.stroke();

    // Body
    ctx.fillStyle = C.amber;
    ctx.beginPath();
    ctx.arc(cx, cy, p.w / 2, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    const eyeOffX = p.facingRight ? 5 : -5;
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(cx + eyeOffX - 4, cy - 4, 5, 0, Math.PI * 2);
    ctx.arc(cx + eyeOffX + 4, cy - 4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(cx + eyeOffX - 3, cy - 4, 2.5, 0, Math.PI * 2);
    ctx.arc(cx + eyeOffX + 5, cy - 4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticlesWorld() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    if (p.type === 'ripple') {
      ctx.save();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = C.lumen;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (p.type === 'text') {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = C.lumen;
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = C.teal;
      ctx.shadowBlur = 6;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawHUD(ts) {
  // Stage & timer
  const timeLeft = Math.ceil(stageTime);
  const timerColor = stageTime < 10 ? '#FF5733' : C.lumen;

  ctx.save();
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = C.lumen;
  ctx.shadowColor = C.teal;
  ctx.shadowBlur = 8;
  ctx.fillText(`STAGE ${stageIndex + 1}`, 16, 28);
  ctx.fillStyle = timerColor;
  ctx.fillText(`TIME: ${timeLeft}`, 16, 50);
  ctx.fillStyle = C.lumen;
  ctx.fillText(`★ ${starsCollected}/${totalStarsInStage}`, 16, 72);

  // Grade preview
  const rate = totalStarsInStage > 0 ? starsCollected / totalStarsInStage : 0;
  const previewGrade = calcGrade(rate, Math.floor(stageTime));
  ctx.textAlign = 'right';
  ctx.font = 'bold 24px monospace';
  ctx.shadowColor = C.teal;
  ctx.shadowBlur = 12;
  ctx.fillStyle = C.lumen;
  ctx.fillText(previewGrade, W - 16, 32);

  // Controls hint (small)
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.55;
  ctx.shadowBlur = 0;
  ctx.fillStyle = C.lumen;
  ctx.fillText('← → / A D: 이동  |  Space / ↑ / W: 점프  |  적 머리 밟기: 처치', W / 2, H - 10);
  ctx.restore();
}

function drawOverlay(text, color) {
  ctx.save();
  ctx.fillStyle = 'rgba(13,13,43,0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillText(text, W / 2, H / 2);
  ctx.restore();
}

function drawGameClear() {
  ctx.save();
  ctx.fillStyle = 'rgba(13,13,43,0.82)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = C.teal;
  ctx.shadowBlur = 20;

  ctx.font = 'bold 52px monospace';
  ctx.fillStyle = C.lumen;
  ctx.fillText('GAME CLEAR!', W / 2, H / 2 - 80);

  ctx.font = 'bold 80px monospace';
  ctx.fillStyle = finalGrade === 'S' ? '#FFD700' : finalGrade === 'A' ? C.teal : finalGrade === 'B' ? C.amber : C.lumen;
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 30;
  ctx.fillText(finalGrade, W / 2, H / 2 + 10);

  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = C.lumen;
  ctx.shadowBlur = 8;
  const mins = Math.floor(totalTime / 60);
  const secs = Math.floor(totalTime % 60);
  ctx.fillText(`총 시간: ${mins}:${secs.toString().padStart(2,'0')}`, W / 2, H / 2 + 70);
  ctx.fillText(`별 조각: ${allStarsCollected}/${allStarsTotal}`, W / 2, H / 2 + 100);

  ctx.font = '16px monospace';
  ctx.globalAlpha = 0.7;
  ctx.fillText('Space 키를 눌러 처음부터 다시 시작', W / 2, H / 2 + 145);
  ctx.restore();
}

// ---- Loop ----
function loop(ts) {
  update(ts);
  render(ts);
  requestAnimationFrame(loop);
}

// ---- Init ----
stages = makeStages();
initStage(0);
requestAnimationFrame(loop);
</script>
