<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>냥이의 발톱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a14; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #gameCanvas { display: block; max-width: 100vw; max-height: 100vh; image-rendering: pixelated; cursor: none; }
  #touchControls { display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; background: rgba(0,0,0,0.4); }
  @media (pointer: coarse) { #touchControls { display: flex; justify-content: space-between; align-items: center; } }
  .touch-btn { background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: #fff; font-size: 22px; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; touch-action: none; }
  .touch-group { display: flex; gap: 8px; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="500" aria-label="냥이의 발톱 게임 캔버스" role="img"></canvas>
<div id="touchControls" aria-label="터치 컨트롤">
  <div class="touch-group">
    <div class="touch-btn" id="btnLeft" aria-label="왼쪽">◀</div>
    <div class="touch-btn" id="btnRight" aria-label="오른쪽">▶</div>
  </div>
  <div class="touch-group">
    <div class="touch-btn" id="btnClaw" aria-label="발톱 공격">🐾</div>
    <div class="touch-btn" id="btnDash" aria-label="돌진">💨</div>
  </div>
</div>
<script>
(function(){
'use strict';

// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;

// ── Asset loading ─────────────────────────────────────────────────────────────
const imgs = {};
const ASSETS = [
  ['player',       'assets/player.png'],
  ['playerAtk',    'assets/player-attack.png'],
  ['playerDash',   'assets/player-dash.png'],
  ['slime',        'assets/enemy-slime.png'],
  ['ghost',        'assets/enemy-ghost.png'],
  ['mushroom',     'assets/enemy-mushroom.png'],
  ['boss',         'assets/enemy-boss.png'],
  ['heart',        'assets/collectible-heart.png'],
  ['backdrop',     'assets/backdrop.png'],
];
let assetsLoaded = 0;
const TOTAL_ASSETS = ASSETS.length;
ASSETS.forEach(([key, src]) => {
  const img = new Image();
  img.onload  = () => { imgs[key] = img; assetsLoaded++; };
  img.onerror = () => { imgs[key] = null; assetsLoaded++; };
  img.src = src;
});

// ── Palette ───────────────────────────────────────────────────────────────────
const PAL = {
  catOrange:'#F4A35A', catStripe:'#C0622A', catWhite:'#FFF5E4',
  slimeGreen:'#7EE87E', ghostWhite:'#E8EEF7', mushRed:'#E84040',
  bossPurple:'#7B3FA0', outline:'#1A1A1A',
  wallColor:'#8B7355', floorColor:'#4A4A5A', lampYellow:'#FFE066',
  uiBg:'#1E1E2E', uiAccent:'#FF6B9D', healthRed:'#FF3355', scoreGold:'#FFD700',
};

// ── Game constants ────────────────────────────────────────────────────────────
const PLAYER_SPEED   = 220;
const PLAYER_W       = 80;
const PLAYER_H       = 56;
const CLAW_RANGE     = 60;
const CLAW_DAMAGE    = 2;
const DASH_RANGE     = 200;
const DASH_DAMAGE    = 1;
const DASH_COOLDOWN  = 3.0;
const DASH_DURATION  = 0.25;
const CONTACT_INTERVAL = 0.5;
const PLAYER_MAX_HP  = 10;
const ENEMY_BASE_HP  = 3;
const BOSS_HP        = 6;
const FLOOR_Y        = H - 80;
const GROUND_Y       = FLOOR_Y + 10;

// Wave config: [monsterCount, speed]
const WAVE_CONFIG = [
  [5,  50],   // wave 1
  [7,  60],   // wave 2
  [9,  70],   // wave 3
  [11, 80],   // wave 4
  [13, 90],   // wave 5
];
const TOTAL_WAVES = 5;
const REST_DURATION = 3.0;

// ── State ─────────────────────────────────────────────────────────────────────
let state = 'PLAYING'; // PLAYING | WAVE_REST | GAME_OVER | RESULT
let wave = 1;
let restTimer = 0;
let score = 0;
let killCount = 0;
let player, enemies, particles, scorePopups, clawEffect, dashTrails;
let lastTime = 0;

// ── Input ─────────────────────────────────────────────────────────────────────
const keys = {};
const justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyZ','KeyA','KeyD','KeyW','KeyS','KeyR'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls
function setupTouch(id, code) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('pointerdown', e => { e.preventDefault(); keys[code] = true; justPressed[code] = true; });
  el.addEventListener('pointerup',   e => { e.preventDefault(); keys[code] = false; });
  el.addEventListener('pointerleave',e => { keys[code] = false; });
}
setupTouch('btnLeft',  'ArrowLeft');
setupTouch('btnRight', 'ArrowRight');
setupTouch('btnClaw',  'Space');
setupTouch('btnDash',  'KeyZ');

// ── Player factory ────────────────────────────────────────────────────────────
function makePlayer() {
  return {
    x: W / 2, y: GROUND_Y,
    vx: 0,
    hp: PLAYER_MAX_HP,
    facing: 1,          // 1=right, -1=left
    dashCooldown: 0,
    dashTimer: 0,
    isDashing: false,
    dashDir: 1,
    clawTimer: 0,       // visual only
    attackTimer: 0,     // show attack sprite
    contactTimers: {},  // enemyId -> timer
  };
}

// ── Enemy factory ─────────────────────────────────────────────────────────────
let enemyIdCounter = 0;
function makeEnemy(x, speed, isBoss, type) {
  return {
    id: enemyIdCounter++,
    x, y: GROUND_Y,
    speed,
    isBoss,
    type,   // 'slime'|'ghost'|'mushroom'|'boss'
    hp: isBoss ? BOSS_HP : ENEMY_BASE_HP,
    maxHp: isBoss ? BOSS_HP : ENEMY_BASE_HP,
    w: isBoss ? 90 : 56,
    h: isBoss ? 90 : 56,
    hitFlash: 0,
    dead: false,
  };
}

// ── Particle factory ──────────────────────────────────────────────────────────
function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const speed = 60 + Math.random() * 80;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 40,
      life: 0.5 + Math.random() * 0.3,
      maxLife: 0.5 + Math.random() * 0.3,
      size: 6 + Math.random() * 6,
      color,
      shape: Math.random() < 0.5 ? 'heart' : 'star',
    });
  }
}

function spawnScorePopup(x, y, text) {
  scorePopups.push({ x, y, text, life: 0.8, maxLife: 0.8 });
}

// ── Init game ─────────────────────────────────────────────────────────────────
function initGame() {
  state = 'PLAYING';
  wave = 1;
  score = 0;
  killCount = 0;
  restTimer = 0;
  player = makePlayer();
  enemies = [];
  particles = [];
  scorePopups = [];
  clawEffect = null;
  dashTrails = [];
  spawnWave(wave);
}

function spawnWave(waveNum) {
  const [count, speed] = WAVE_CONFIG[waveNum - 1];
  const types = ['slime', 'ghost', 'mushroom'];
  enemies = [];
  for (let i = 0; i < count; i++) {
    const fromLeft = i % 2 === 0;
    const x = fromLeft ? -60 - Math.random() * 200 : W + 60 + Math.random() * 200;
    const type = waveNum === 5 && i === 0 ? 'boss' : types[Math.floor(Math.random() * types.length)];
    const isBoss = type === 'boss';
    enemies.push(makeEnemy(x, speed * (isBoss ? 0.6 : 1), isBoss, type));
  }
}

// ── Update ────────────────────────────────────────────────────────────────────
function update(dt) {
  if (state === 'WAVE_REST') {
    restTimer -= dt;
    if (restTimer <= 0) {
      wave++;
      if (wave > TOTAL_WAVES) {
        // Calculate final score
        score = Math.floor(killCount * (1 + player.hp * 0.1));
        state = 'RESULT';
      } else {
        state = 'PLAYING';
        spawnWave(wave);
      }
    }
    updateParticles(dt);
    updateScorePopups(dt);
    return;
  }
  if (state !== 'PLAYING') return;

  // ── Player movement ──
  let moveX = 0;
  if (keys['ArrowLeft']  || keys['KeyA']) moveX -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;

  // Dash overrides movement
  if (player.isDashing) {
    player.dashTimer -= dt;
    player.x += player.dashDir * DASH_RANGE / DASH_DURATION * dt;
    // Add trail
    dashTrails.push({ x: player.x, y: player.y, life: 0.2, maxLife: 0.2 });
    if (player.dashTimer <= 0) {
      player.isDashing = false;
    }
  } else {
    player.x += moveX * PLAYER_SPEED * dt;
    if (moveX !== 0) player.facing = moveX;
  }

  // Clamp player to screen
  player.x = Math.max(PLAYER_W / 2, Math.min(W - PLAYER_W / 2, player.x));

  // Dash cooldown
  if (player.dashCooldown > 0) player.dashCooldown -= dt;

  // Attack timers
  if (player.clawTimer > 0) player.clawTimer -= dt;
  if (player.attackTimer > 0) player.attackTimer -= dt;

  // ── Claw attack (Space) ──
  if (justPressed['Space']) {
    doClaw();
  }

  // ── Dash (Z or ArrowUp / KeyW) ──
  if ((justPressed['KeyZ'] || justPressed['ArrowUp'] || justPressed['KeyW']) && !player.isDashing && player.dashCooldown <= 0) {
    doDash();
  }

  // ── Enemy update ──
  enemies.forEach(e => {
    if (e.dead) return;
    const dir = e.x < player.x ? 1 : -1;
    e.x += dir * e.speed * dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;

    // Contact damage
    if (Math.abs(e.x - player.x) < (PLAYER_W / 2 + e.w / 2) * 0.8) {
      if (!player.contactTimers[e.id]) player.contactTimers[e.id] = 0;
      player.contactTimers[e.id] += dt;
      if (player.contactTimers[e.id] >= CONTACT_INTERVAL) {
        player.hp -= 1;
        player.contactTimers[e.id] = 0;
        spawnParticles(player.x, player.y - 20, 4, PAL.healthRed);
        if (player.hp <= 0) {
          player.hp = 0;
          state = 'GAME_OVER';
        }
      }
    } else {
      player.contactTimers[e.id] = 0;
    }
  });

  // Remove dead enemies
  enemies = enemies.filter(e => !e.dead);

  // Check wave clear
  if (enemies.length === 0) {
    if (wave === TOTAL_WAVES) {
      score = Math.floor(killCount * (1 + player.hp * 0.1));
      state = 'RESULT';
    } else {
      state = 'WAVE_REST';
      restTimer = REST_DURATION;
      spawnParticles(W / 2, H / 2, 20, PAL.scoreGold);
    }
  }

  // Update dash trails
  dashTrails = dashTrails.filter(t => t.life > 0);
  dashTrails.forEach(t => t.life -= dt);

  // Claw effect
  if (clawEffect) {
    clawEffect.timer -= dt;
    if (clawEffect.timer <= 0) clawEffect = null;
  }

  updateParticles(dt);
  updateScorePopups(dt);

  // Clear justPressed
  for (const k in justPressed) delete justPressed[k];
}

function doClaw() {
  player.clawTimer = 0.15;
  player.attackTimer = 0.15;
  const cx = player.x + player.facing * (PLAYER_W / 2 + CLAW_RANGE / 2);
  clawEffect = { x: cx, y: player.y - 20, dir: player.facing, timer: 0.15 };
  enemies.forEach(e => {
    if (e.dead) return;
    const dist = Math.abs(e.x - player.x);
    if (dist < PLAYER_W / 2 + CLAW_RANGE + e.w / 2) {
      // Must be in front
      const inFront = (player.facing === 1 && e.x > player.x - 20) ||
                      (player.facing === -1 && e.x < player.x + 20);
      if (inFront) {
        hitEnemy(e, CLAW_DAMAGE);
      }
    }
  });
}

function doDash() {
  player.isDashing = true;
  player.dashTimer = DASH_DURATION;
  player.dashDir = player.facing;
  player.dashCooldown = DASH_COOLDOWN;
  player.attackTimer = DASH_DURATION;
  // Immediate hit check along dash path
  enemies.forEach(e => {
    if (e.dead) return;
    const ahead = player.facing === 1 ? (e.x > player.x && e.x < player.x + DASH_RANGE + e.w) :
                                        (e.x < player.x && e.x > player.x - DASH_RANGE - e.w);
    if (ahead && Math.abs(e.y - player.y) < 60) {
      hitEnemy(e, DASH_DAMAGE);
    }
  });
}

function hitEnemy(e, dmg) {
  e.hp -= dmg;
  e.hitFlash = 0.15;
  if (e.hp <= 0) {
    e.dead = true;
    killCount++;
    const pts = e.isBoss ? 10 : 2;
    spawnParticles(e.x, e.y - e.h / 2, e.isBoss ? 12 : 6, e.isBoss ? PAL.bossPurple : PAL.slimeGreen);
    spawnScorePopup(e.x, e.y - e.h, '+' + pts);
  }
}

function updateParticles(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= dt;
  });
  particles = particles.filter(p => p.life > 0);
}

function updateScorePopups(dt) {
  scorePopups.forEach(p => { p.y -= 40 * dt; p.life -= dt; });
  scorePopups = scorePopups.filter(p => p.life > 0);
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function drawBackdrop() {
  if (imgs.backdrop) {
    ctx.drawImage(imgs.backdrop, 0, 0, W, H);
  } else {
    // Fallback: draw alley
    ctx.fillStyle = '#1E1E2E';
    ctx.fillRect(0, 0, W, H);
    // Floor
    ctx.fillStyle = PAL.floorColor;
    ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
    // Floor tiles
    ctx.strokeStyle = '#3a3a4a';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, FLOOR_Y); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = FLOOR_Y; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    // Brick walls
    ctx.fillStyle = PAL.wallColor;
    ctx.fillRect(0, 0, W, FLOOR_Y);
    ctx.strokeStyle = '#6b5335';
    ctx.lineWidth = 1.5;
    for (let row = 0; row < FLOOR_Y / 20; row++) {
      const offset = row % 2 === 0 ? 0 : 30;
      for (let col = -offset; col < W; col += 60) {
        ctx.strokeRect(col, row * 20, 58, 18);
      }
    }
    // Lamps
    drawLamp(80, 0);
    drawLamp(W - 80, 0);
  }
}

function drawLamp(x, y) {
  // Glow
  const grd = ctx.createRadialGradient(x, y + 60, 5, x, y + 60, 120);
  grd.addColorStop(0, 'rgba(255,224,102,0.35)');
  grd.addColorStop(1, 'rgba(255,224,102,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(x - 120, y, 240, 200);
  // Pole
  ctx.fillStyle = '#555';
  ctx.fillRect(x - 4, y, 8, 80);
  // Lamp head
  ctx.fillStyle = PAL.lampYellow;
  ctx.beginPath();
  ctx.ellipse(x, y + 20, 16, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayerFallback(p, sprite) {
  ctx.save();
  ctx.translate(p.x, p.y - PLAYER_H / 2);
  if (p.facing === -1) ctx.scale(-1, 1);
  // Body
  ctx.fillStyle = PAL.catWhite;
  ctx.beginPath();
  ctx.ellipse(0, 0, PLAYER_W / 2, PLAYER_H / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Stripes
  ctx.fillStyle = PAL.catOrange;
  for (let i = -2; i <= 2; i++) {
    ctx.fillRect(i * 12 - 4, -PLAYER_H / 2, 8, PLAYER_H);
  }
  ctx.fillStyle = PAL.catStripe;
  for (let i = -1; i <= 1; i++) {
    ctx.fillRect(i * 12 - 2, -PLAYER_H / 2, 4, PLAYER_H);
  }
  // Outline
  ctx.strokeStyle = PAL.outline;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, PLAYER_W / 2, PLAYER_H / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  // Ears
  ctx.fillStyle = PAL.catOrange;
  ctx.beginPath();
  ctx.moveTo(-20, -PLAYER_H / 2);
  ctx.lineTo(-30, -PLAYER_H / 2 - 18);
  ctx.lineTo(-10, -PLAYER_H / 2 + 4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10, -PLAYER_H / 2);
  ctx.lineTo(20, -PLAYER_H / 2 - 18);
  ctx.lineTo(28, -PLAYER_H / 2 + 4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = PAL.outline; ctx.lineWidth = 2;
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(-12, -4, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -4, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-12, -4, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(12, -4, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  let img = imgs.player;
  if (p.isDashing && imgs.playerDash) img = imgs.playerDash;
  else if (p.attackTimer > 0 && imgs.playerAtk) img = imgs.playerAtk;

  if (img) {
    const scale = PLAYER_H / img.height * 1.6;
    const dw = img.width * scale;
    const dh = img.height * scale;
    if (p.facing === -1) {
      ctx.scale(-1, 1);
    }
    ctx.drawImage(img, -dw / 2, -dh, dw, dh);
  } else {
    drawPlayerFallback(p, null);
  }

  // Dash trails
  if (p.isDashing) {
    dashTrails.forEach((t, i) => {
      ctx.save();
      ctx.globalAlpha = t.life / t.maxLife * 0.4;
      ctx.fillStyle = PAL.lampYellow;
      ctx.fillRect(-(p.dashDir * i * 12) - 20, -PLAYER_H * 0.5, 40, 4);
      ctx.restore();
    });
  }

  ctx.restore();
}

function drawEnemyFallback(e) {
  ctx.save();
  ctx.translate(e.x, e.y - e.h / 2);
  if (e.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 50) * 0.5;
  const s = e.isBoss ? 1.5 : 1;
  ctx.scale(s, s);
  const hw = e.w / 2 / s, hh = e.h / 2 / s;

  if (e.type === 'slime' || e.type === 'boss') {
    ctx.fillStyle = e.isBoss ? PAL.bossPurple : PAL.slimeGreen;
    ctx.beginPath();
    ctx.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = 2.5;
    ctx.stroke();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-hw * 0.3, -hh * 0.1, hw * 0.2, hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hw * 0.3, -hh * 0.1, hw * 0.2, hh * 0.25, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(-hw * 0.3, -hh * 0.1, hw * 0.1, hh * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hw * 0.3, -hh * 0.1, hw * 0.1, hh * 0.15, 0, 0, Math.PI * 2); ctx.fill();
    if (e.isBoss) {
      // Crown
      ctx.fillStyle = PAL.scoreGold;
      ctx.beginPath();
      ctx.moveTo(-hw * 0.5, -hh);
      ctx.lineTo(-hw * 0.5, -hh - 14);
      ctx.lineTo(-hw * 0.2, -hh - 8);
      ctx.lineTo(0, -hh - 18);
      ctx.lineTo(hw * 0.2, -hh - 8);
      ctx.lineTo(hw * 0.5, -hh - 14);
      ctx.lineTo(hw * 0.5, -hh);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = PAL.outline; ctx.lineWidth = 1.5; ctx.stroke();
    }
  } else if (e.type === 'ghost') {
    ctx.fillStyle = PAL.ghostWhite;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.2, hw * 0.9, Math.PI, 0);
    ctx.bezierCurveTo(hw * 0.9, hh * 0.5, hw * 0.6, hh * 0.3, hw * 0.3, hh * 0.5);
    ctx.bezierCurveTo(0, hh * 0.7, -hw * 0.3, hh * 0.3, -hw * 0.6, hh * 0.5);
    ctx.bezierCurveTo(-hw * 0.9, hh * 0.7, -hw * 0.9, hh * 0.3, -hw * 0.9, -hh * 0.2);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(-hw * 0.3, -hh * 0.1, hw * 0.15, hh * 0.18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hw * 0.3, -hh * 0.1, hw * 0.15, hh * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'mushroom') {
    // Body
    ctx.fillStyle = PAL.catWhite;
    ctx.fillRect(-hw * 0.4, -hh * 0.1, hw * 0.8, hh * 0.6);
    // Cap
    ctx.fillStyle = PAL.mushRed;
    ctx.beginPath();
    ctx.arc(0, -hh * 0.2, hw * 0.9, Math.PI, 0, false);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = 2; ctx.stroke();
    // Spots
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-hw * 0.3, -hh * 0.4, hw * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hw * 0.3, -hh * 0.5, hw * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -hh * 0.6, hw * 0.08, 0, Math.PI * 2); ctx.fill();
    // Eyes
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.ellipse(-hw * 0.2, -hh * 0.05, hw * 0.12, hh * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hw * 0.2, -hh * 0.05, hw * 0.12, hh * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    // Legs
    ctx.fillStyle = PAL.catWhite;
    ctx.strokeStyle = PAL.outline; ctx.lineWidth = 2;
    ctx.fillRect(-hw * 0.35, hh * 0.45, hw * 0.25, hh * 0.3);
    ctx.strokeRect(-hw * 0.35, hh * 0.45, hw * 0.25, hh * 0.3);
    ctx.fillRect(hw * 0.1, hh * 0.45, hw * 0.25, hh * 0.3);
    ctx.strokeRect(hw * 0.1, hh * 0.45, hw * 0.25, hh * 0.3);
  }
  ctx.restore();
}

function drawEnemy(e) {
  if (e.dead) return;
  ctx.save();
  if (e.hitFlash > 0) ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Date.now() / 40)) * 0.5;

  const imgKey = e.type === 'boss' ? 'boss' : e.type === 'slime' ? 'slime' : e.type === 'ghost' ? 'ghost' : 'mushroom';
  const img = imgs[imgKey];
  const scale = e.isBoss ? 1.5 : 1.0;
  const drawH = e.h * scale * 1.4;
  const drawW = img ? img.width * (drawH / img.height) : e.w * scale;

  if (img) {
    const dir = e.x < player.x ? 1 : -1;
    ctx.translate(e.x, e.y);
    if (dir === -1) ctx.scale(-1, 1);
    ctx.drawImage(img, -drawW / 2, -drawH, drawW, drawH);
  } else {
    ctx.translate(0, 0);
    drawEnemyFallback(e);
  }

  ctx.restore();

  // HP bar for boss
  if (e.isBoss) {
    const bw = 80, bh = 8;
    const bx = e.x - bw / 2, by = e.y - e.h * 1.5 - 16;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = PAL.healthRed;
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
    ctx.strokeStyle = PAL.outline;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

function drawClawEffect() {
  if (!clawEffect) return;
  ctx.save();
  ctx.translate(clawEffect.x, clawEffect.y);
  if (clawEffect.dir === -1) ctx.scale(-1, 1);
  const alpha = clawEffect.timer / 0.15;
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(0, i * 12, 28, -Math.PI * 0.6, Math.PI * 0.1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.translate(p.x, p.y);
    const s = p.size * (p.life / p.maxLife);
    if (p.shape === 'heart') {
      ctx.font = `${s * 2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('♥', 0, 0);
    } else {
      ctx.font = `${s * 2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★', 0, 0);
    }
    ctx.restore();
  });
}

function drawScorePopups() {
  scorePopups.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = PAL.scoreGold;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  });
}

function drawHUD() {
  // Background bar
  ctx.fillStyle = 'rgba(30,30,46,0.85)';
  ctx.fillRect(0, 0, W, 48);

  // HP bar
  const hpBarW = 160, hpBarH = 18;
  const hpX = 48, hpY = 14;
  // Heart icon
  if (imgs.heart) {
    ctx.drawImage(imgs.heart, 8, 10, 28, 24);
  } else {
    ctx.fillStyle = PAL.healthRed;
    ctx.font = '22px serif';
    ctx.fillText('♥', 8, 32);
  }
  ctx.fillStyle = '#333';
  roundRect(ctx, hpX, hpY, hpBarW, hpBarH, 6);
  ctx.fill();
  ctx.fillStyle = PAL.healthRed;
  roundRect(ctx, hpX, hpY, hpBarW * (player.hp / PLAYER_MAX_HP), hpBarH, 6);
  ctx.fill();
  ctx.strokeStyle = PAL.outline;
  ctx.lineWidth = 2;
  roundRect(ctx, hpX, hpY, hpBarW, hpBarH, 6);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(player.hp + '/' + PLAYER_MAX_HP, hpX + hpBarW / 2, hpY + 13);

  // Wave indicator
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('WAVE ' + wave + ' / ' + TOTAL_WAVES, W / 2, 30);
  // Wave progress bar
  const wpW = 120;
  const waveProgress = 1 - (enemies.length / (WAVE_CONFIG[wave - 1][0]));
  ctx.fillStyle = '#333';
  ctx.fillRect(W / 2 - wpW / 2, 34, wpW, 6);
  ctx.fillStyle = PAL.uiAccent;
  ctx.fillRect(W / 2 - wpW / 2, 34, wpW * Math.max(0, waveProgress), 6);

  // Score
  ctx.fillStyle = PAL.scoreGold;
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('처치: ' + killCount, W - 12, 22);
  ctx.fillStyle = '#aaa';
  ctx.font = '13px sans-serif';
  ctx.fillText('점수: ' + Math.floor(killCount * (1 + player.hp * 0.1)), W - 12, 40);

  // Dash cooldown bar
  const dcW = 100, dcH = 14;
  const dcX = W / 2 - dcW / 2, dcY = H - 30;
  ctx.fillStyle = 'rgba(30,30,46,0.8)';
  roundRect(ctx, dcX - 4, dcY - 2, dcW + 8, dcH + 4, 4);
  ctx.fill();
  const dashReady = player.dashCooldown <= 0;
  ctx.fillStyle = dashReady ? '#4af' : '#555';
  const fill = dashReady ? dcW : dcW * (1 - player.dashCooldown / DASH_COOLDOWN);
  roundRect(ctx, dcX, dcY, fill, dcH, 3);
  ctx.fill();
  ctx.strokeStyle = PAL.outline; ctx.lineWidth = 1.5;
  roundRect(ctx, dcX, dcY, dcW, dcH, 3);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(dashReady ? '돌진 준비!' : '돌진 쿨타임', W / 2, dcY + 11);

  // Controls hint
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('← →/A D: 이동 | Space: 발톱 | Z/↑/W: 돌진', 8, H - 8);
}

function roundRect(ctx, x, y, w, h, r) {
  if (w < 0) w = 0;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawWaveRest() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = PAL.scoreGold;
  ctx.font = 'bold 42px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = PAL.scoreGold;
  ctx.shadowBlur = 20;
  ctx.fillText('Wave ' + wave + ' Clear!', W / 2, H / 2 - 30);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText(Math.ceil(restTimer) + '초 후 다음 웨이브...', W / 2, H / 2 + 20);
  ctx.fillStyle = PAL.uiAccent;
  ctx.font = '18px sans-serif';
  ctx.fillText('처치 수: ' + killCount, W / 2, H / 2 + 60);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = PAL.healthRed;
  ctx.font = 'bold 52px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = PAL.healthRed;
  ctx.shadowBlur = 30;
  ctx.fillText('GAME OVER', W / 2, H / 2 - 50);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('웨이브 ' + wave + ' | 처치 수: ' + killCount, W / 2, H / 2 + 10);
  ctx.fillStyle = PAL.scoreGold;
  ctx.font = '18px sans-serif';
  ctx.fillText('[R] 키로 다시 시작', W / 2, H / 2 + 50);
}

function getRank(sc) {
  if (sc >= 200) return 'S';
  if (sc >= 150) return 'A';
  if (sc >= 100) return 'B';
  return 'C';
}

function drawResult() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);

  // Fireworks particles
  drawParticles();

  // Result panel
  ctx.fillStyle = PAL.uiBg;
  ctx.strokeStyle = PAL.scoreGold;
  ctx.lineWidth = 4;
  roundRect(ctx, W / 2 - 200, H / 2 - 160, 400, 300, 20);
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = PAL.scoreGold;
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('🎉 5웨이브 클리어! 🎉', W / 2, H / 2 - 110);

  // Rank circle
  const rank = getRank(score);
  const rankColors = { S:'#FFD700', A:'#FF6B9D', B:'#4af', C:'#aaa' };
  ctx.fillStyle = rankColors[rank] || '#fff';
  ctx.beginPath();
  ctx.arc(W / 2, H / 2 - 30, 55, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = PAL.outline; ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = PAL.uiBg;
  ctx.font = 'bold 64px sans-serif';
  ctx.fillText(rank, W / 2, H / 2 - 10);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText('최종 점수: ' + score, W / 2, H / 2 + 60);
  ctx.fillStyle = '#aaa';
  ctx.font = '15px sans-serif';
  ctx.fillText('처치 수 ' + killCount + ' × (1 + ' + player.hp + ' × 0.1)', W / 2, H / 2 + 90);
  ctx.fillStyle = PAL.uiAccent;
  ctx.font = '18px sans-serif';
  ctx.fillText('[R] 키로 다시 시작', W / 2, H / 2 + 125);
}

// ── Main render ───────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);
  drawBackdrop();

  // Ground line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 4);
  ctx.lineTo(W, GROUND_Y + 4);
  ctx.stroke();

  if (state === 'PLAYING' || state === 'WAVE_REST') {
    enemies.forEach(e => drawEnemy(e));
    drawPlayer(player);
    drawClawEffect();
    drawParticles();
    drawScorePopups();
    drawHUD();
    if (state === 'WAVE_REST') drawWaveRest();
  } else if (state === 'GAME_OVER') {
    enemies.forEach(e => drawEnemy(e));
    drawPlayer(player);
    drawParticles();
    drawHUD();
    drawGameOver();
  } else if (state === 'RESULT') {
    drawResult();
  }
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function loop(ts) {
  if (assetsLoaded < TOTAL_ASSETS) {
    // Loading screen
    ctx.fillStyle = '#1E1E2E';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('로딩 중... ' + assetsLoaded + '/' + TOTAL_ASSETS, W / 2, H / 2);
    requestAnimationFrame(loop);
    return;
  }

  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  // R key restart
  if (justPressed['KeyR'] && (state === 'GAME_OVER' || state === 'RESULT')) {
    initGame();
    for (const k in justPressed) delete justPressed[k];
  }

  update(dt);
  render();
  requestAnimationFrame(loop);
}

// ── Start ─────────────────────────────────────────────────────────────────────
initGame();
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(loop); });

})();
</script>
